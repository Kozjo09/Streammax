<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamMax Pro</title>
    <!-- DNS Prefetch and Preconnect Hints for performance optimization -->
    <link rel="dns-prefetch" href="https://api.themoviedb.org">
    <link rel="dns-prefetch" href="https://image.tmdb.org">
    <link rel="dns-prefetch" href="https://vidsrc-embed.ru">
    <link rel="dns-prefetch" href="https://vidsrc-embed.su">
    <link rel="dns-prefetch" href="https://embedmaster.link">
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>

    <script>
        tailwind = {
            config: {
                theme: {
                    extend: {
                        screens: {
                            'xs': '360px',
                            '2xl': '1536px',
                            '3xl': '1920px',
                            '4xl': '2560px',
                            '5xl': '3840px',
                        }
                    }
                }
            }
        };
        tailwind.config = tailwind.config;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800;1,900&display=swap');

        @media (min-width: 1920px) { html { font-size: 18px; } }
        @media (min-width: 2560px) { html { font-size: 22px; } }
        @media (min-width: 3840px) { html { font-size: 28px; } }
        @media (max-width: 320px) { html { font-size: 13px; } }

        body {
            background: #05020a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .accent { color: #a855f7; }
        .bg-accent { background-color: #7c3aed; color: #ffffff; }
        .text-accent-glow { text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

        .glass-header {
            background: rgba(8, 4, 15, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s ease-in-out;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }
        .glass-header.scrolled {
            background: rgba(11, 6, 22, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.25);
        }

        .card {
            background: #110826;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.25);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .shelf-container {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .shelf-container > * {
            scroll-snap-align: start;
        }

        /* Player & Server Knoppen */
        .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(139, 92, 246, 0.2); }
        .srv-btn { flex: 1; text-align: center; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 12px 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .srv-btn.active { background: #7c3aed; color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); border-color: #a855f7; }
        .srv-btn.inactive { background: #110826; color: #64748b; border-color: rgba(139, 92, 246, 0.2); }

        /* Episode Grid */
        .ep-btn { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 800; font-size: 14px; transition: all 0.2s; cursor: pointer; }
        .ep-current { background: #a855f7; color: white; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border: 2px solid #d8b4fe; }
        .ep-watched { background: #2a1354; color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }
        .ep-available { background: #1a0c3b; color: #94a3b8; border: 1px solid transparent; }
        .ep-available:hover { background: #3b1c7a; color: white; }
        .ep-future { background: #0a0514; color: #334155; cursor: not-allowed; }

        /* Inputs & Kaarten */
        .input-group { background: #110826; border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 14px; padding: 14px; color: white; outline: none; -webkit-appearance: none; }
        .poster-card { aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; background: #0e071b; position: relative; border: 1px solid rgba(255,255,255,0.05); display: block; cursor: pointer; transition: transform 0.2s; }
        .poster-card:active { transform: scale(0.96); }
        .img-cover { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .img-loaded { opacity: 1; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }

        #toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            z-index: 10000;
            pointer-events: none;
        }
        @media (min-width: 1536px) { #toast-container { max-width: 500px; } }
        @media (min-width: 2560px) { #toast-container { max-width: 650px; } }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        :fullscreen #app-header, :fullscreen #app-navigation,
        :-webkit-full-screen #app-header, :-webkit-full-screen #app-navigation,
        body.is-fullscreen #app-header, body.is-fullscreen #app-navigation {
            display: none !important;
        }
    </style>
</head>
<body class="pb-32 relative">

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <!-- Glass Header -->
    <header id="app-header" class="fixed top-0 left-0 right-0 z-50 glass-header p-3 sm:p-4 lg:px-10 2xl:px-16 3xl:px-20">
        <div class="flex items-center justify-between max-w-7xl 2xl:max-w-[1600px] 3xl:max-w-[2000px] 4xl:max-w-[2560px] 5xl:max-w-[92vw] mx-auto">
            <div class="flex items-center gap-6 lg:gap-12">
                <button onclick="nav('home')" class="text-2xl lg:text-3xl 2xl:text-4xl 3xl:text-5xl font-black italic uppercase tracking-tighter text-purple-500 transition-transform hover:scale-105">STREAM<span class="text-white">MAX</span></button>
                <nav class="hidden md:flex items-center gap-6 2xl:gap-10 text-[11px] 2xl:text-sm 3xl:text-base font-black uppercase tracking-widest text-slate-400">
                    <button onclick="nav('home')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-home">Home</button>
                    <button onclick="nav('movies')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-movies">Films</button>
                    <button onclick="nav('tv')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-tv">Series</button>
                    <button onclick="nav('history')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-history">Verder Kijken</button>
                </nav>
            </div>
            <div id="header-right-controls" class="flex gap-4 items-center">
                <button onclick="nav('search')" class="w-10 h-10 rounded-full bg-[#110826] flex items-center justify-center border border-purple-500/20 hover:border-purple-500/50 text-slate-300 hover:text-purple-400 transition-all duration-300" title="Zoeken"><i class="fa-solid fa-search text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="content" class="p-3 sm:p-4 pt-20 sm:pt-24 2xl:pt-32 max-w-7xl 2xl:max-w-[1600px] 3xl:max-w-[2000px] 4xl:max-w-[2560px] 5xl:max-w-[92vw] mx-auto min-h-[60vh]">
        <div class="text-center py-24" id="main-loader">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl text-purple-500 mb-4"></i>
            <p class="text-xs uppercase tracking-widest text-slate-500 animate-pulse">Laden...</p>
        </div>
    </main>

    <!-- Bottom Navigation for Mobile -->
    <nav id="app-navigation" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#08040f]/90 backdrop-blur-2xl rounded-2xl px-3 py-2 flex justify-around items-center shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-[100] border border-purple-500/20 md:hidden">
        <button onclick="nav('home')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-home" title="Home" aria-label="Home"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Home</span></button>
        <button onclick="nav('movies')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-movies" title="Films" aria-label="Films"><i class="fa-solid fa-film text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Films</span></button>
        <button onclick="nav('tv')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-tv" title="Series" aria-label="Series"><i class="fa-solid fa-tv text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Series</span></button>
        <button onclick="nav('history')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-history" title="Historie" aria-label="Historie"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Historie</span></button>
        <button onclick="nav('search')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-search" title="Zoeken" aria-label="Zoeken"><i class="fa-solid fa-search text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Zoeken</span></button>
    </nav>

    <!-- TMDb Details Slide-up Modal Drawer -->
    <div id="details-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[5000] hidden overflow-y-auto no-scrollbar justify-center items-start p-2 sm:p-4 md:p-10">
        <div class="bg-[#0e071b] border border-purple-500/20 rounded-2xl md:rounded-3xl max-w-4xl lg:max-w-5xl xl:max-w-6xl 2xl:max-w-7xl 3xl:max-w-[1800px] 4xl:max-w-[2200px] w-full shadow-2xl overflow-hidden relative mt-4 sm:mt-6 md:mt-16 mb-20">
            <!-- Close Button -->
            <button onclick="closeDetailsModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center border border-white/10 hover:border-purple-500/50 transition-all z-50">
                <i class="fa-solid fa-times"></i>
            </button>

            <!-- Backdrop Banner -->
            <div class="relative w-full h-[22vh] xs:h-[25vh] md:h-[40vh] 2xl:h-[45vh] 3xl:h-[50vh] bg-[#05020a]">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0e071b] via-[#0e071b]/60 to-transparent z-10"></div>
                <img id="detail-banner" class="w-full h-full object-cover">
                <div class="absolute bottom-6 left-6 md:left-10 z-20 flex gap-6 items-end">
                    <img id="detail-poster" class="hidden md:block w-28 h-40 lg:w-32 lg:h-48 2xl:w-40 2xl:h-60 rounded-xl object-cover shadow-2xl border border-purple-500/20">
                    <div class="space-y-3">
                        <span id="detail-badge" class="px-2.5 py-1 rounded bg-purple-600/30 text-purple-300 text-[9px] font-black uppercase tracking-wider border border-purple-500/30">FILM</span>
                        <h2 id="detail-title" class="text-xl sm:text-2xl md:text-5xl 2xl:text-6xl 3xl:text-7xl font-black italic uppercase tracking-tighter text-white leading-none"></h2>
                        <div class="flex items-center gap-3 text-[10px] md:text-xs font-bold text-slate-400">
                            <span id="detail-score" class="text-purple-300 bg-purple-900/30 px-2 py-0.5 rounded font-black"><i class="fa-solid fa-star text-[9px] mr-1 text-purple-400"></i></span>
                            <span id="detail-year" class="bg-[#110826] px-2 py-0.5 rounded border border-purple-500/20"></span>
                            <span id="detail-runtime" class="bg-[#110826] px-2 py-0.5 rounded border border-purple-500/20"></span>
                        </div>
                        <button id="detail-play-btn" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 hover:scale-105 active:scale-95 transition-all font-bold mt-2 shadow-[0_0_15px_rgba(124,58,237,0.4)]">
                            <i class="fa-solid fa-play"></i> Nu Kijken
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-6 md:p-10 space-y-10">
                <!-- Synopsis / Overview -->
                <div class="space-y-4">
                    <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Beschrijving</h3>
                    <p id="detail-desc" class="text-slate-300 text-sm leading-relaxed"></p>
                    <div id="detail-genres" class="flex flex-wrap gap-2 pt-2"></div>
                </div>

                <!-- Interactive Episodes (Only for TV Shows) -->
                <div id="detail-tv-section" class="hidden space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Afleveringen</h3>
                        <select id="detailSeasonSelect" onchange="changeDetailSeason()" class="bg-[#110826] text-purple-400 text-xs font-bold py-2 px-3 rounded-xl outline-none cursor-pointer border border-purple-500/30">
                        </select>
                    </div>
                    <div id="detail-episodes-grid" class="grid grid-cols-4 xs:grid-cols-5 sm:grid-cols-10 md:grid-cols-12 2xl:grid-cols-15 3xl:grid-cols-20 gap-2">
                    </div>
                </div>

                <!-- Relations / Franchise / Recommendations -->
                <div id="detail-related-section" class="space-y-4 hidden">
                    <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Gerelateerd & Aanbevolen</h3>
                    <div id="detail-relations-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-5 gap-3 2xl:gap-4">
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURATIE & API
═══════════════════════════════════════════════════════════════ */
const TMDB_KEY = "d817468ccaad3dc61a7e78bc148125e6";

const API_URLS = {
    trending_movies: 'https://api.themoviedb.org/3/trending/movie/week?api_key=' + TMDB_KEY + '&language=nl-NL',
    trending_tv:     'https://api.themoviedb.org/3/trending/tv/week?api_key='    + TMDB_KEY + '&language=nl-NL',
    airing_today:    'https://api.themoviedb.org/3/tv/airing_today?api_key='     + TMDB_KEY + '&language=nl-NL'
};

let app = {
    view: 'home',
    mediaId: null,
    tmdbId: null,
    type: 'movie',
    title: '',
    season: 1,
    episode: 1,
    totalSeasons: 1,
    totalEpsInSeason: 1,
    srv: '1'
};

let detailMedia = {
    id: null,
    tmdbId: null,
    type: 'movie',
    currentSeason: 1
};

/* Slimme popup blocker om speler-crashes aan het einde van video's te voorkomen */
(function () {
    const _orig = window.open;
    window.open = function (url) {
        if (!url || url === '' || url === 'about:blank') return _orig.apply(this, arguments);
        return {
            focus: function() {},
            blur: function() {},
            close: function() {},
            location: { href: "" },
            document: {}
        };
    };
})();

/* ─────────────────────────────────────────────────────────────
   NAVIGATIE & ROUTING
───────────────────────────────────────────────────────────── */
function nav(viewName, params = {}) {
    app.view = viewName;

    // Header & Mobile Nav active states
    document.querySelectorAll('#app-header nav button').forEach(el => {
        el.classList.remove('text-purple-400');
        el.classList.add('text-slate-400');
    });
    let headActive = document.getElementById('head-nav-' + viewName);
    if (headActive) {
        headActive.classList.add('text-purple-400');
        headActive.classList.remove('text-slate-400');
    }

    document.querySelectorAll('#app-navigation .nav-link').forEach(el => {
        el.classList.remove('text-purple-400');
        el.classList.add('text-slate-400');
    });
    let mobileActive = document.getElementById('nav-' + viewName);
    if (mobileActive) {
        mobileActive.classList.add('text-purple-400');
        mobileActive.classList.remove('text-slate-400');
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (viewName === 'player') {
        if (params.id) {
            app.mediaId = String(params.id).trim();
            app.tmdbId = app.mediaId;
            app.type = params.type || 'movie';
            app.season = parseInt(params.s) || 1;
            app.episode = parseInt(params.e) || 1;
            app.srv = params.srv || '1';
        }
        renderPlayerPage();
    } else if (viewName === 'movies') {
        renderGridPage('movies');
    } else if (viewName === 'tv') {
        renderGridPage('tv');
    } else if (viewName === 'history') {
        renderHistoryPage();
    } else if (viewName === 'search') {
        renderSearchPage();
    } else {
        renderHomePage();
    }
}

function showToast(msg) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'animate-toast p-4 rounded-xl flex items-center gap-3 text-xs font-black uppercase tracking-widest shadow-2xl border bg-purple-950 text-purple-200 border-purple-500/30';
    el.innerHTML = `<i class="fa-solid fa-info-circle text-purple-400"></i> ${msg}`;
    container.appendChild(el);
    setTimeout(() => {
        el.style.animation = 'slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
        setTimeout(() => el.remove(), 300);
    }, 3000);
}

/* ─────────────────────────────────────────────────────────────
   HOME PAGE RENDERING
───────────────────────────────────────────────────────────── */
async function renderHomePage() {
    const main = document.getElementById('content');
    main.innerHTML = `
        <div class="space-y-10">
            <!-- Hero Banner -->
            <div id="home-hero" class="w-full min-h-[260px] xs:min-h-[300px] md:h-[45vh] 2xl:h-[50vh] 3xl:h-[55vh] 4xl:h-[60vh] bg-[#0e071b] rounded-2xl md:rounded-3xl overflow-hidden border border-purple-500/10 relative flex items-end p-4 sm:p-6 md:p-10 2xl:p-14 3xl:p-16 shadow-2xl">
                <div class="absolute inset-0 bg-gradient-to-t from-[#05020a] via-[#05020a]/75 to-transparent z-10"></div>
                <div class="relative z-20 space-y-3 2xl:space-y-4 max-w-2xl 2xl:max-w-4xl 3xl:max-w-5xl">
                    <span class="bg-purple-600 text-white text-[9px] font-black px-2.5 py-1 rounded-md uppercase tracking-wider font-bold">Populairste Nu</span>
                    <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-6xl 3xl:text-7xl 4xl:text-8xl font-black italic uppercase tracking-tighter text-white animate-fade-in leading-tight" id="hero-title">Laden...</h1>
                    <p class="text-[11px] md:text-xs 2xl:text-sm 3xl:text-base 4xl:text-lg text-slate-400 line-clamp-2 md:line-clamp-3 2xl:line-clamp-4 animate-fade-in leading-relaxed" id="hero-desc"></p>
                    <div class="flex gap-2.5 pt-1">
                        <button id="hero-play" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 2xl:px-8 2xl:py-4 3xl:px-10 3xl:py-5 rounded-xl text-xs 2xl:text-sm 3xl:text-base font-black uppercase tracking-widest hover:scale-105 transition shadow-[0_0_20px_rgba(124,58,237,0.3)] font-bold flex items-center"><i class="fa-solid fa-play mr-2"></i> Kijk Nu</button>
                        <button id="hero-info" class="bg-[#110826]/80 backdrop-blur text-white px-4 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 2xl:px-8 2xl:py-4 3xl:px-10 3xl:py-5 rounded-xl text-xs 2xl:text-sm 3xl:text-base font-black uppercase tracking-widest hover:bg-[#1f0f42] transition flex items-center border border-purple-500/20"><i class="fa-solid fa-info-circle mr-2"></i> Info</button>
                    </div>
                </div>
                <img id="hero-img" class="absolute inset-0 w-full h-full object-cover opacity-50">
            </div>

            <!-- Continue Watching Shelf -->
            <div id="home-history-section" class="hidden space-y-4 animate-fade-in">
                <h2 class="text-lg sm:text-xl 2xl:text-2xl 3xl:text-3xl font-black italic uppercase tracking-tighter flex items-center gap-2"><i class="fa-solid fa-play text-purple-500"></i> Verder Kijken</h2>
                <div id="home-history-shelf" class="shelf-container no-scrollbar pb-4"></div>
            </div>

            <div id="home-trending-movies" class="space-y-4"></div>
            <div id="home-trending-tv" class="space-y-4"></div>
        </div>
    `;

    renderHomeHistory();

    try {
        let [moviesRes, tvRes] = await Promise.all([
            fetch(API_URLS.trending_movies),
            fetch(API_URLS.trending_tv)
        ]);
        let moviesData = await moviesRes.json();
        let tvData = await tvRes.json();

        if (moviesData.results && moviesData.results.length > 0) {
            let hero = moviesData.results[0];
            document.getElementById('hero-title').innerText = hero.title || hero.name || '';
            document.getElementById('hero-desc').innerText = hero.overview || '';
            if (hero.backdrop_path || hero.poster_path) {
                document.getElementById('hero-img').src = 'https://image.tmdb.org/t/p/w1280' + (hero.backdrop_path || hero.poster_path);
            }
            document.getElementById('hero-play').onclick = () => nav('player', { id: hero.id, type: 'movie' });
            document.getElementById('hero-info').onclick = () => openDetailsModal(hero.id, 'movie');

            renderShelf('home-trending-movies', 'Trending Films', moviesData.results.slice(1, 12), 'movie');
        }

        if (tvData.results && tvData.results.length > 0) {
            renderShelf('home-trending-tv', 'Populaire Series', tvData.results.slice(0, 12), 'tv');
        }
    } catch (err) {
        console.error("Fout bij laden home feeds:", err);
    }
}

function injectIframe() {
    let { mediaId, type, season, episode, srv } = app;
    let isIMDb = String(mediaId).startsWith('tt');
    let idParam = isIMDb ? ('imdb=' + mediaId) : ('tmdb=' + mediaId);
    let url = "";

    if (srv === '1') {
        url = type === 'movie' ? `https://vidsrc-embed.ru/embed/movie?${idParam}`
                               : `https://vidsrc-embed.ru/embed/tv?${idParam}&season=${season}&episode=${episode}`;
    } else if (srv === '2') {
        url = type === 'movie' ? `https://vidsrc-embed.su/embed/movie?${idParam}`
                               : `https://vidsrc-embed.su/embed/tv?${idParam}&season=${season}&episode=${episode}`;
    } else {
        url = type === 'movie' ? `https://embedmaster.link/movie/${mediaId}`
                               : `https://embedmaster.link/tv/${mediaId}/${season}/${episode}`;
    }

    let refPol = (srv !== '3') ? ' referrerpolicy="origin"' : '';
    let playerBox = document.getElementById('playerBox');
    if (playerBox) {
        playerBox.innerHTML = `<iframe src="${url}" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *" allowfullscreen${refPol} scrolling="no"></iframe>`;
    }
}

function changeServer(srvId) {
    app.srv = String(srvId);
    ['1','2','3'].forEach(id => {
        let btn = document.getElementById('btn-srv-' + id);
        if (btn) btn.className = 'srv-btn ' + (id === app.srv ? 'active' : 'inactive');
    });
    if (app.mediaId) {
        injectIframe();
        saveToHistory();
    }
}

function renderSeasonDropdown(seasons) {
    let select = document.getElementById('seasonSelect');
    if (!select) return;
    select.innerHTML = seasons.map(s => 
        `<option value="${s.season_number}" ${s.season_number === app.season ? 'selected' : ''}>Seizoen ${s.season_number}</option>`
    ).join('');
}

async function changeSeason() {
    let select = document.getElementById('seasonSelect');
    if (!select) return;
    let newSeason = parseInt(select.value);
    await loadSeasonAndPlay(newSeason, 1);
}

async function loadSeasonAndPlay(seasonNum, epNum) {
    app.season = seasonNum;
    app.episode = epNum;

    let container = document.getElementById('episodesContainer');
    if (container) container.innerHTML = '<div class="col-span-full text-purple-500 text-xs py-4 text-center tracking-widest uppercase font-bold">Data ophalen...</div>';

    try {
        let res = await fetch(`https://api.themoviedb.org/3/tv/${app.tmdbId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=nl-NL`);
        let sData = await res.json();

        let episodes = sData.episodes || [];
        app.totalEpsInSeason = episodes.length || 1;

        let curLabel = document.getElementById('currentEpLabel');
        let totLabel = document.getElementById('totalEpLabel');
        if (curLabel) curLabel.innerText = epNum;
        if (totLabel) totLabel.innerText = app.totalEpsInSeason;

        renderGrid(episodes);
        injectIframe();
        markAsWatched(seasonNum, epNum);
        saveToHistory();
    } catch (err) {
        console.error("Fout bij laden seizoen:", err);
        injectIframe();
    }
}

function renderGrid(episodesData) {
    let container = document.getElementById('episodesContainer');
    if (!container) return;
    let watchedMap = getWatchedEpisodes(app.mediaId, app.season);
    let today = new Date().toISOString().split('T')[0];

    if (!episodesData || episodesData.length === 0) {
        container.innerHTML = '<div class="col-span-full text-slate-500 text-xs py-4 text-center">Geen afleveringen gevonden voor dit seizoen.</div>';
        return;
    }

    container.innerHTML = episodesData.map(ep => {
        let epNum = ep.episode_number;
        let isCurrent = (epNum === app.episode);
        let isWatched = watchedMap.includes(epNum);
        let hasAired = ep.air_date && ep.air_date <= today;

        let btnClass = "ep-btn ";
        let onClick = `onclick="playSpecificEpisode(${epNum})"`;

        if (isCurrent) {
            btnClass += "ep-current";
        } else if (isWatched) {
            btnClass += "ep-watched";
        } else if (hasAired || !ep.air_date) {
            btnClass += "ep-available";
        } else {
            btnClass += "ep-future";
            onClick = `onclick="showToast('Deze aflevering is nog niet uitgekomen.')"`;
        }

        return `<div ${onClick} class="${btnClass}">${epNum}</div>`;
    }).join('');
}

function playSpecificEpisode(epNum) {
    app.episode = epNum;
    let curLabel = document.getElementById('currentEpLabel');
    if (curLabel) curLabel.innerText = epNum;

    markAsWatched(app.season, epNum);

    let container = document.getElementById('episodesContainer');
    if (container) {
        let buttons = container.querySelectorAll('.ep-btn');
        let watchedMap = getWatchedEpisodes(app.mediaId, app.season);
        buttons.forEach((btn, index) => {
            let n = index + 1;
            btn.className = "ep-btn " +
                (n === epNum ? "ep-current" :
                 watchedMap.includes(n) ? "ep-watched" :
                 btn.classList.contains("ep-future") ? "ep-future" : "ep-available");
        });
    }

    injectIframe();
    saveToHistory();
}

function goNextEpisode() {
    if (document.fullscreenElement) { document.exitFullscreen().catch(e => console.log(e)); }

    if (app.episode < app.totalEpsInSeason) {
        playSpecificEpisode(app.episode + 1);
    } else {
        let seasonSelect = document.getElementById('seasonSelect');
        if (seasonSelect && app.season < seasonSelect.options.length) {
            seasonSelect.value = app.season + 1;
            changeSeason();
        } else {
            showToast("Je bent helemaal bij! Dit was de laatste aflevering.");
        }
    }
}

window.addEventListener('message', function(e) {
    if ((e.data === 'video_ended' || e.data?.event === 'ended')) {
        let toggle = document.getElementById('autoNextToggle');
        if (toggle && toggle.checked) {
            goNextEpisode();
        }
    }
});

function manualLoad() {
    let inputId = document.getElementById('imdbInput').value.trim();
    let inputType = document.getElementById('typeInput').value;
    if (!inputId) {
        showToast("Vul een geldig IMDb of TMDb ID in.");
        return;
    }
    nav('player', { id: inputId, type: inputType });
}

async function loadRelatedContent(tmdbId, type, data) {
    let relatedContainer = document.getElementById('relatedSection');
    if (!relatedContainer) return;
    relatedContainer.innerHTML = '';

    let htmlContent = '';
    let hasContent = false;

    if (type === 'movie' && data && data.belongs_to_collection) {
        try {
            let colRes = await fetch(`https://api.themoviedb.org/3/collection/${data.belongs_to_collection.id}?api_key=${TMDB_KEY}&language=nl-NL`);
            let colData = await colRes.json();

            if (colData && colData.parts && colData.parts.length > 1) {
                let sortedParts = colData.parts.sort((a, b) => {
                    let dateA = a.release_date || '9999-12-31';
                    let dateB = b.release_date || '9999-12-31';
                    return dateA.localeCompare(dateB);
                });

                let currentIndex = sortedParts.findIndex(item => String(item.id) === String(tmdbId));

                if (currentIndex !== -1) {
                    let prequels = sortedParts.slice(0, currentIndex);
                    let sequels = sortedParts.slice(currentIndex + 1);

                    if (prequels.length > 0) {
                        hasContent = true;
                        htmlContent += `<div class="space-y-3">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Prequels</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                ${prequels.map((item, idx) => createCardHTML(item, 'movie', `Prequel ${idx + 1}`)).join('')}
                            </div>
                        </div>`;
                    }

                    if (sequels.length > 0) {
                        hasContent = true;
                        htmlContent += `<div class="space-y-3">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Sequels</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                ${sequels.map((item, idx) => createCardHTML(item, 'movie', `Sequel ${currentIndex + 2 + idx}`)).join('')}
                            </div>
                        </div>`;
                    }
                }
            }
        } catch (colErr) {
            console.error("Fout bij ophalen collectie:", colErr);
        }
    }

    try {
        let recRes = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/recommendations?api_key=${TMDB_KEY}&language=nl-NL`);
        let recData = await recRes.json();
        let recs = (recData.results || []).filter(item => String(item.id) !== String(tmdbId)).slice(0, 6);

        if (recs.length > 0) {
            hasContent = true;
            htmlContent += `<div class="space-y-3">
                <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Gerelateerd & Aanbevolen</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    ${recs.map(item => createCardHTML(item, type)).join('')}
                </div>
            </div>`;
        }
    } catch (recErr) {
        console.error("Fout bij ophalen aanbevelingen:", recErr);
    }

    if (hasContent) {
        relatedContainer.innerHTML = htmlContent;
        relatedContainer.classList.remove('hidden');
    }
}

function createCardHTML(item, mediaType, customBadge) {
    let title = (item.title || item.name || 'Onbekend').replace(/"/g, '&quot;');
    let posterSrc = item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : '';
    let badgeText = customBadge || (mediaType === 'tv' ? 'Serie' : 'Film');

    return `
        <div onclick="nav('player', {id: '${item.id}', type: '${mediaType}'})" class="poster-card border border-purple-500/10">
            ${posterSrc ? `<img src="${posterSrc}" class="img-cover img-loaded">` : `<div class="w-full h-full flex items-center justify-center p-2 text-[10px] text-slate-500 text-center font-bold uppercase">${title}</div>`}
            <div class="absolute inset-0 bg-gradient-to-t from-[#05020a]/90 via-transparent flex flex-col justify-end p-3">
                <p class="text-[10px] font-black text-white truncate shadow-black">${title}</p>
                <p class="text-[8px] font-bold text-purple-400 uppercase mt-1">${badgeText}</p>
            </div>
        </div>
    `;
}

/* ─────────────────────────────────────────────────────────────
   SLIDE-UP DETAILS MODAL
───────────────────────────────────────────────────────────── */
async function openDetailsModal(tmdbId, type = 'movie') {
    detailMedia.tmdbId = tmdbId;
    detailMedia.type = type;
    detailMedia.currentSeason = 1;

    const modal = document.getElementById('details-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';

    document.getElementById('detail-title').innerText = "Laden...";
    document.getElementById('detail-banner').src = "";
    document.getElementById('detail-poster').src = "";
    document.getElementById('detail-desc').innerText = "Moment geduld...";
    document.getElementById('detail-genres').innerHTML = "";
    document.getElementById('detail-tv-section').classList.add('hidden');
    document.getElementById('detail-related-section').classList.add('hidden');

    try {
        let endpoint = type === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${tmdbId}?api_key=${TMDB_KEY}&language=nl-NL`);
        let data = await res.json();

        let titleStr = data.title || data.name || 'Onbekende Titel';
        document.getElementById('detail-title').innerText = titleStr;
        document.getElementById('detail-banner').src = data.backdrop_path ? `https://image.tmdb.org/t/p/w1280${data.backdrop_path}` : '';
        document.getElementById('detail-poster').src = data.poster_path ? `https://image.tmdb.org/t/p/w342${data.poster_path}` : '';
        document.getElementById('detail-desc').innerText = data.overview || 'Geen beschrijving beschikbaar.';
        document.getElementById('detail-score').innerHTML = `<i class="fa-solid fa-star text-[9px] mr-1 text-purple-400"></i> ${data.vote_average ? data.vote_average.toFixed(1) : '?'}`;
        document.getElementById('detail-year').innerText = (data.release_date || data.first_air_date || '').substring(0, 4) || '?';
        document.getElementById('detail-badge').innerText = type === 'tv' ? 'Serie' : 'Film';

        let runtimeLabel = document.getElementById('detail-runtime');
        if (type === 'movie') {
            runtimeLabel.innerText = data.runtime ? `${data.runtime} min` : 'Film';
        } else {
            runtimeLabel.innerText = `${data.number_of_seasons || 1} Seizoen(en)`;
        }

        const playBtn = document.getElementById('detail-play-btn');
        playBtn.onclick = () => {
            closeDetailsModal();
            nav('player', { id: tmdbId, type: type, s: 1, e: 1 });
        };

        const genContainer = document.getElementById('detail-genres');
        genContainer.innerHTML = '';
        if (data.genres) {
            data.genres.forEach(g => {
                genContainer.innerHTML += `<span class="bg-[#110826] text-purple-300 text-[10px] font-bold px-3 py-1 rounded-full border border-purple-500/20">${g.name}</span>`;
            });
        }

        if (type === 'tv' && data.seasons) {
            let validSeasons = data.seasons.filter(s => s.season_number > 0);
            let select = document.getElementById('detailSeasonSelect');
            select.innerHTML = validSeasons.map(s => `<option value="${s.season_number}">Seizoen ${s.season_number}</option>`).join('');
            document.getElementById('detail-tv-section').classList.remove('hidden');
            loadDetailSeason(validSeasons[0] ? validSeasons[0].season_number : 1);
        }

        loadModalRelated(tmdbId, type, data);
    } catch (err) {
        console.error("Fout bij laden modal details:", err);
    }
}

async function loadDetailSeason(seasonNum) {
    detailMedia.currentSeason = seasonNum;
    let grid = document.getElementById('detail-episodes-grid');
    grid.innerHTML = '<div class="col-span-full text-purple-500 text-xs py-4 text-center">Laden...</div>';

    try {
        let res = await fetch(`https://api.themoviedb.org/3/tv/${detailMedia.tmdbId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=nl-NL`);
        let sData = await res.json();
        let episodes = sData.episodes || [];

        grid.innerHTML = episodes.map(ep => `
            <button onclick="closeDetailsModal(); nav('player', {id: '${detailMedia.tmdbId}', type: 'tv', s: ${seasonNum}, e: ${ep.episode_number}})" class="aspect-square rounded-xl font-black text-xs transition-all bg-[#110826] text-slate-300 hover:bg-purple-600 hover:text-white border border-purple-500/20">${ep.episode_number}</button>
        `).join('');
    } catch (err) {
        grid.innerHTML = '<div class="col-span-full text-red-400 text-xs py-4 text-center">Fout bij laden afleveringen.</div>';
    }
}

function changeDetailSeason() {
    let select = document.getElementById('detailSeasonSelect');
    if (!select) return;
    loadDetailSeason(parseInt(select.value));
}

async function loadModalRelated(tmdbId, type, data) {
    const section = document.getElementById('detail-related-section');
    const grid = document.getElementById('detail-relations-grid');
    grid.innerHTML = '';

    try {
        let recRes = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/recommendations?api_key=${TMDB_KEY}&language=nl-NL`);
        let recData = await recRes.json();
        let items = (recData.results || []).slice(0, 5);

        if (items.length > 0) {
            grid.innerHTML = items.map(item => {
                let itemTitle = (item.title || item.name || 'Onbekend').replace(/"/g, '&quot;');
                let posterSrc = item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : '';
                return `
                    <div onclick="openDetailsModal('${item.id}', '${type}')" class="card p-3 flex gap-3 items-center text-left cursor-pointer hover:border-purple-500/40">
                        <img src="${posterSrc}" class="w-12 h-16 object-cover rounded-lg">
                        <div class="truncate">
                            <p class="text-white text-xs font-bold truncate">${itemTitle}</p>
                            <p class="text-[9px] text-purple-400 font-bold uppercase mt-1">${type === 'tv' ? 'Serie' : 'Film'}</p>
                        </div>
                    </div>
                `;
            }).join('');
            section.classList.remove('hidden');
        }
    } catch (err) {
        console.error("Fout bij gerelateerde titels:", err);
    }
}

function closeDetailsModal() {
    const modal = document.getElementById('details-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.style.overflow = 'auto';
}

/* ─────────────────────────────────────────────────────────────
   HISTORY & WATCHED STORAGE
───────────────────────────────────────────────────────────── */
function saveToHistory() {
    if (!app.mediaId) return;
    let h = JSON.parse(localStorage.getItem('streammax_history') || '{}');
    h[app.mediaId] = {
        title: app.title || app.mediaId,
        type: app.type,
        season: app.season,
        episode: app.episode,
        srv: app.srv,
        time: Date.now()
    };
    localStorage.setItem('streammax_history', JSON.stringify(h));
}

function getWatchedEpisodes(mediaId, season) {
    let w = JSON.parse(localStorage.getItem('streammax_watched') || '{}');
    if (!w[mediaId] || !w[mediaId][season]) return [];
    return w[mediaId][season];
}

function markAsWatched(season, epNum) {
    if (!app.mediaId) return;
    let w = JSON.parse(localStorage.getItem('streammax_watched') || '{}');
    if (!w[app.mediaId]) w[app.mediaId] = {};
    if (!w[app.mediaId][season]) w[app.mediaId][season] = [];

    if (!w[app.mediaId][season].includes(epNum)) {
        w[app.mediaId][season].push(epNum);
        localStorage.setItem('streammax_watched', JSON.stringify(w));
    }
}

async function updateCardImage(id, type, className) {
    try {
        let endpoint = type === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${TMDB_KEY}`);
        let data = await res.json();
        if (data.backdrop_path || data.poster_path) {
            document.querySelectorAll('.' + className).forEach(img => {
                img.src = 'https://image.tmdb.org/t/p/w500' + (data.backdrop_path || data.poster_path);
            });
        }
    } catch (err) {}
}

/* ─────────────────────────────────────────────────────────────
   STICKY HEADER SCROLL EVENT
───────────────────────────────────────────────────────────── */
window.addEventListener('scroll', () => {
    const header = document.getElementById('app-header');
    if (!header) return;
    if (window.scrollY > 40) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

   STARTUP
───────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
    nav('home');
});
