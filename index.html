    if (!app.mediaId) return;

    try {
        if (app.mediaId.startsWith('tt')) {
            let findRes = await fetch(`https://api.themoviedb.org/3/find/${app.mediaId}?api_key=${TMDB_KEY}&external_source=imdb_id`);
            let findData = await findRes.json();
            let results = app.type === 'tv' ? findData.tv_results : findData.movie_results;
            if (results && results.length > 0) {
                app.tmdbId = results[0].id;
            }
        }

        let endpoint = app.type === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${app.tmdbId}?api_key=${TMDB_KEY}&language=nl-NL`);
        let data = await res.json();

        app.title = data.title || data.name || "Onbekende Titel";
        document.getElementById('mediaTitle').innerText = app.title;

        if (app.type === 'tv') {
            document.getElementById('tvStats').classList.remove('hidden');
            document.getElementById('movieStats').classList.add('hidden');
            document.getElementById('tvEpisodesSection').classList.remove('hidden');
            document.getElementById('tvControls').classList.remove('hidden');

            let validSeasons = (data.seasons || []).filter(s => s.season_number > 0);
            app.totalSeasons = validSeasons.length || 1;

            if (validSeasons.length > 0) {
                if (!validSeasons.find(s => s.season_number === app.season)) {
                    app.season = validSeasons[0].season_number;
                }
                renderSeasonDropdown(validSeasons);
            }

            await loadSeasonAndPlay(app.season, app.episode);
        } else {
            document.getElementById('tvStats').classList.add('hidden');
            document.getElementById('movieStats').classList.remove('hidden');
            document.getElementById('runtimeLabel').innerText = data.runtime || '?';

            injectIframe();
            saveToHistory();
        }

        loadRelatedContent(app.tmdbId, app.type, data);
    } catch (err) {
        console.error("Fout bij laden player data:", err);
        document.getElementById('mediaTitle').innerText = app.title || "Titel Geladen";
        injectIframe();
        saveToHistory();
    }
}

function injectIframe() {
    let { mediaId, type, season, episode, srv } = app;
    let safeMediaId = encodeURIComponent(String(mediaId || ''));
    let safeType = (type === 'tv') ? 'tv' : 'movie';
    let safeSeason = parseInt(season, 10) || 1;
    let safeEpisode = parseInt(episode, 10) || 1;
    let isIMDb = String(mediaId).startsWith('tt');
    let idParam = isIMDb ? ('imdb=' + safeMediaId) : ('tmdb=' + safeMediaId);
    let url = "";

    if (srv === '1') {
        url = safeType === 'movie' ? `https://vidsrc-embed.ru/embed/movie?${idParam}`
                                   : `https://vidsrc-embed.ru/embed/tv?${idParam}&season=${safeSeason}&episode=${safeEpisode}`;
    } else if (srv === '2') {
        url = safeType === 'movie' ? `https://vidsrc-embed.su/embed/movie?${idParam}`
                                   : `https://vidsrc-embed.su/embed/tv?${idParam}&season=${safeSeason}&episode=${safeEpisode}`;
    } else {
        url = safeType === 'movie' ? `https://embedmaster.link/movie/${safeMediaId}`
                                   : `https://embedmaster.link/tv/${safeMediaId}/${safeSeason}/${safeEpisode}`;
    }

    let safeUrl = escapeHTML(url);
    let refPol = (srv !== '3') ? ' referrerpolicy="origin"' : '';
    let playerBox = document.getElementById('playerBox');
    if (playerBox) {
        playerBox.innerHTML = `<iframe src="${safeUrl}" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *" allowfullscreen${refPol} scrolling="no"></iframe>`;
    }
}

function changeServer(srvId) {
    app.srv = String(srvId);
    ['1','2','3'].forEach(id => {
        let btn = document.getElementById('btn-srv-' + id);
        if (btn) btn.className = 'srv-btn ' + (id === app.srv ? 'active' : 'inactive');
    });
    if (app.mediaId) {
        injectIframe();
        saveToHistory();
    }
}

function renderSeasonDropdown(seasons) {
    let select = document.getElementById('seasonSelect');
    if (!select) return;
    select.innerHTML = seasons.map(s => 
        `<option value="${s.season_number}" ${s.season_number === app.season ? 'selected' : ''}>Seizoen ${s.season_number}</option>`
    ).join('');
}

async function changeSeason() {
    let select = document.getElementById('seasonSelect');
    if (!select) return;
    let newSeason = parseInt(select.value);
    await loadSeasonAndPlay(newSeason, 1);
}

async function loadSeasonAndPlay(seasonNum, epNum) {
    app.season = seasonNum;
    app.episode = epNum;

    let container = document.getElementById('episodesContainer');
    if (container) container.innerHTML = '<div class="col-span-full text-purple-500 text-xs py-4 text-center tracking-widest uppercase font-bold">Data ophalen...</div>';

    try {
        let res = await fetch(`https://api.themoviedb.org/3/tv/${app.tmdbId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=nl-NL`);
        let sData = await res.json();

        let episodes = sData.episodes || [];
        app.totalEpsInSeason = episodes.length || 1;

        let curLabel = document.getElementById('currentEpLabel');
        let totLabel = document.getElementById('totalEpLabel');
        if (curLabel) curLabel.innerText = epNum;
        if (totLabel) totLabel.innerText = app.totalEpsInSeason;

        renderGrid(episodes);
        injectIframe();
        markAsWatched(seasonNum, epNum);
        saveToHistory();
    } catch (err) {
        console.error("Fout bij laden seizoen:", err);
        injectIframe();
    }
}

function renderGrid(episodesData) {
    let container = document.getElementById('episodesContainer');
    if (!container) return;
    let watchedMap = getWatchedEpisodes(app.mediaId, app.season);
    let today = new Date().toISOString().split('T')[0];

    if (!episodesData || episodesData.length === 0) {
        container.innerHTML = '<div class="col-span-full text-slate-500 text-xs py-4 text-center">Geen afleveringen gevonden voor dit seizoen.</div>';
        return;
    }

    container.innerHTML = episodesData.map(ep => {
        let epNum = ep.episode_number;
        let isCurrent = (epNum === app.episode);
        let isWatched = watchedMap.includes(epNum);
        let hasAired = ep.air_date && ep.air_date <= today;

        let btnClass = "ep-btn ";
        let onClick = `onclick="playSpecificEpisode(${epNum})"`;

        if (isCurrent) {
            btnClass += "ep-current";
        } else if (isWatched) {
            btnClass += "ep-watched";
        } else if (hasAired || !ep.air_date) {
            btnClass += "ep-available";
        } else {
            btnClass += "ep-future";
            onClick = `onclick="showToast('Deze aflevering is nog niet uitgekomen.')"`;
        }

        return `<div ${onClick} class="${btnClass}">${epNum}</div>`;
    }).join('');
}

function playSpecificEpisode(epNum) {
    app.episode = epNum;
    let curLabel = document.getElementById('currentEpLabel');
    if (curLabel) curLabel.innerText = epNum;

    markAsWatched(app.season, epNum);

    let container = document.getElementById('episodesContainer');
    if (container) {
        let buttons = container.querySelectorAll('.ep-btn');
        let watchedMap = getWatchedEpisodes(app.mediaId, app.season);
        buttons.forEach((btn, index) => {
            let n = index + 1;
            btn.className = "ep-btn " +
                (n === epNum ? "ep-current" :
                 watchedMap.includes(n) ? "ep-watched" :
                 btn.classList.contains("ep-future") ? "ep-future" : "ep-available");
        });
    }

    injectIframe();
    saveToHistory();
}

function goNextEpisode() {
    if (document.fullscreenElement) { document.exitFullscreen().catch(e => console.log(e)); }

    if (app.episode < app.totalEpsInSeason) {
        playSpecificEpisode(app.episode + 1);
    } else {
        let seasonSelect = document.getElementById('seasonSelect');
        if (seasonSelect && app.season < seasonSelect.options.length) {
            seasonSelect.value = app.season + 1;
            changeSeason();
        } else {
            showToast("Je bent helemaal bij! Dit was de laatste aflevering.");
        }
    }
}

window.addEventListener('message', function(e) {
    if ((e.data === 'video_ended' || e.data?.event === 'ended')) {
        let toggle = document.getElementById('autoNextToggle');
        if (toggle && toggle.checked) {
            goNextEpisode();
        }
    }
});

function manualLoad() {
    let inputId = document.getElementById('imdbInput').value.trim();
    let inputType = document.getElementById('typeInput').value;
    if (!inputId) {
        showToast("Vul een geldig IMDb of TMDb ID in.");
        return;
    }
    nav('player', { id: inputId, type: inputType });
}

async function getComprehensiveRelated(tmdbId, type, data) {
    let itemsMap = new Map();

    const addItem = (item, mediaType, isFranchise = false) => {
        if (!item || !item.id) return;
        let key = `${mediaType || item.media_type || type}_${item.id}`;
        if (String(item.id) === String(tmdbId) && (item.media_type || type) === type) return;
        if (!itemsMap.has(key)) {
            itemsMap.set(key, {
                ...item,
                media_type: mediaType || item.media_type || type,
                isFranchise: isFranchise
            });
        }
    };

    // 1. Movie collection parts
    if (type === 'movie' && data && data.belongs_to_collection) {
        try {
            let colRes = await fetch(`https://api.themoviedb.org/3/collection/${data.belongs_to_collection.id}?api_key=${TMDB_KEY}&language=nl-NL`);
            let colData = await colRes.json();
            if (colData && colData.parts) {
                colData.parts.forEach(part => addItem(part, 'movie', true));
            }
        } catch (e) {}
    }

    // 2. Extract franchise keywords from title
    let title = (data.title || data.name || '').trim();
    let cleanTitle = title.replace(/^(the|de|het|a|an|la|le|les|el)\s+/i, '').replace(/:\s*.*$/, '');
    let stopWords = new Set(['the', 'de', 'het', 'a', 'an', 'and', 'en', 'of', 'in', 'on', 'for', 'to', 'clash', 'movie', 'series', 'returns', 'reborn', 'rises']);
    let words = cleanTitle.split(/\s+/).map(w => w.replace(/[^\w]/g, '')).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));

    let franchiseKeyword = words[0] || cleanTitle;

    if (franchiseKeyword && franchiseKeyword.length > 2) {
        try {
            let searchRes = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(franchiseKeyword)}&language=nl-NL`);
            let searchData = await searchRes.json();
            if (searchData && searchData.results) {
                searchData.results.forEach(item => {
                    if (item.media_type === 'movie' || item.media_type === 'tv') {
                        let itemTitle = (item.title || item.name || '').toLowerCase();
                        if (itemTitle.includes(franchiseKeyword.toLowerCase())) {
                            addItem(item, item.media_type, true);
                        }
                    }
                });
            }
        } catch (e) {}
    }

    // 3. TMDb Recommendations
    try {
        let recRes = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/recommendations?api_key=${TMDB_KEY}&language=nl-NL`);
        let recData = await recRes.json();
        if (recData && recData.results) {
            recData.results.forEach(item => addItem(item, type, false));
        }
    } catch (e) {}

    // 4. TMDb Similar
    try {
        let simRes = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/similar?api_key=${TMDB_KEY}&language=nl-NL`);
        let simData = await simRes.json();
        if (simData && simData.results) {
            simData.results.forEach(item => addItem(item, type, false));
        }
    } catch (e) {}

    let allItems = Array.from(itemsMap.values());
    allItems.sort((a, b) => (b.isFranchise ? 1 : 0) - (a.isFranchise ? 1 : 0));
    return allItems;
}

async function loadRelatedContent(tmdbId, type, data) {
    let relatedContainer = document.getElementById('relatedSection');
    if (!relatedContainer) return;
    relatedContainer.innerHTML = '';

    let items = await getComprehensiveRelated(tmdbId, type, data);
    let itemsToDisplay = items.slice(0, 12);

    if (itemsToDisplay.length > 0) {
        relatedContainer.innerHTML = `<div class="space-y-3">
            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Gerelateerd & Aanbevolen</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                ${itemsToDisplay.map(item => createCardHTML(item, item.media_type)).join('')}
            </div>
        </div>`;
        relatedContainer.classList.remove('hidden');
    }
}

function createCardHTML(item, mediaType, customBadge) {
    let title = escapeHTML(item.title || item.name || 'Onbekend');
    let posterSrc = item.poster_path ? escapeHTML(`https://image.tmdb.org/t/p/w342${item.poster_path}`) : '';
    let badgeText = escapeHTML(customBadge || (mediaType === 'tv' ? 'Serie' : 'Film'));

    return `
        <div onclick="nav('player', {id: '${encodeURIComponent(item.id)}', type: '${encodeURIComponent(mediaType)}'})" class="poster-card border border-purple-500/10">
            ${posterSrc ? `<img src="${posterSrc}" class="img-cover img-loaded">` : `<div class="w-full h-full flex items-center justify-center p-2 text-[10px] text-slate-500 text-center font-bold uppercase">${title}</div>`}
            <div class="absolute inset-0 bg-gradient-to-t from-[#05020a]/90 via-transparent flex flex-col justify-end p-3">
                <p class="text-[10px] font-black text-white truncate shadow-black">${title}</p>
                <p class="text-[8px] font-bold text-purple-400 uppercase mt-1">${badgeText}</p>
            </div>
        </div>
    `;
}

async function openDetailsModal(tmdbId, type = 'movie') {

    detailMedia.tmdbId = tmdbId;
    detailMedia.type = type;

    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';

    document.getElementById('detail-title').innerText = "Laden...";
    document.getElementById('detail-banner').src = "";
    document.getElementById('detail-poster').src = "";
    document.getElementById('detail-desc').innerText = "Moment geduld...";
    document.getElementById('detail-genres').innerHTML = "";
    document.getElementById('detail-tv-section').classList.add('hidden');
    document.getElementById('detail-related-section').classList.add('hidden');

    try {
        let endpoint = type === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${tmdbId}?api_key=${TMDB_KEY}&language=nl-NL`);
        let data = await res.json();

        let titleStr = data.title || data.name || 'Onbekende Titel';
        document.getElementById('detail-title').innerText = titleStr;
        document.getElementById('detail-banner').src = data.backdrop_path ? `https://image.tmdb.org/t/p/w1280${data.backdrop_path}` : '';
        document.getElementById('detail-poster').src = data.poster_path ? `https://image.tmdb.org/t/p/w342${data.poster_path}` : '';
        document.getElementById('detail-desc').innerText = data.overview || 'Geen beschrijving beschikbaar.';
        document.getElementById('detail-score').innerHTML = `<i class="fa-solid fa-star text-[9px] mr-1 text-purple-400"></i> ${data.vote_average ? data.vote_average.toFixed(1) : '?'}`;
        document.getElementById('detail-year').innerText = (data.release_date || data.first_air_date || '').substring(0, 4) || '?';
        document.getElementById('detail-badge').innerText = type === 'tv' ? 'Serie' : 'Film';

        let runtimeLabel = document.getElementById('detail-runtime');
        if (type === 'movie') {
            runtimeLabel.innerText = data.runtime ? `${data.runtime} min` : 'Film';
        } else {
            runtimeLabel.innerText = `${data.number_of_seasons || 1} Seizoen(en)`;
        }

        const playBtn = document.getElementById('detail-play-btn');
        playBtn.onclick = () => {
            closeDetailsModal();
            nav('player', { id: tmdbId, type: type, s: 1, e: 1 });
        };

        const genContainer = document.getElementById('detail-genres');
        genContainer.innerHTML = '';
        if (data.genres) {
            data.genres.forEach(g => {
                genContainer.innerHTML += `<span class="bg-[#110826] text-purple-300 text-[10px] font-bold px-3 py-1 rounded-full border border-purple-500/20">${escapeHTML(g.name)}</span>`;
            });
        }

        if (type === 'tv' && data.seasons) {
            let validSeasons = data.seasons.filter(s => s.season_number > 0);
            let select = document.getElementById('detailSeasonSelect');
            select.innerHTML = validSeasons.map(s => `<option value="${s.season_number}">Seizoen ${s.season_number}</option>`).join('');
            document.getElementById('detail-tv-section').classList.remove('hidden');
            loadDetailSeason(validSeasons[0] ? validSeasons[0].season_number : 1);
        }

        loadModalRelated(tmdbId, type, data);
    } catch (err) {
        console.error("Fout bij laden modal details:", err);
    }
}

}

/* ─────────────────────────────────────────────────────────────
   HISTORY & WATCHED STORAGE
───────────────────────────────────────────────────────────── */
function saveToHistory() {
    if (!app.mediaId) return;
    let h = JSON.parse(localStorage.getItem('streammax_history') || '{}');
    h[app.mediaId] = {
        title: app.title || app.mediaId,
        type: app.type,
        season: app.season,
        episode: app.episode,
        srv: app.srv,
        time: Date.now()
    };
    localStorage.setItem('streammax_history', JSON.stringify(h));
}

function getWatchedEpisodes(mediaId, season) {
    let w = JSON.parse(localStorage.getItem('streammax_watched') || '{}');
    if (!w[mediaId] || !w[mediaId][season]) return [];
    return w[mediaId][season];
}

function markAsWatched(season, epNum) {
    if (!app.mediaId) return;
    let w = JSON.parse(localStorage.getItem('streammax_watched') || '{}');
    if (!w[app.mediaId]) w[app.mediaId] = {};
    if (!w[app.mediaId][season]) w[app.mediaId][season] = [];

    if (!w[app.mediaId][season].includes(epNum)) {
        w[app.mediaId][season].push(epNum);
        localStorage.setItem('streammax_watched', JSON.stringify(w));
    }
}

async function updateCardImage(id, type, className) {
    try {
        let endpoint = type === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${TMDB_KEY}`);
        let data = await res.json();
        if (data.backdrop_path || data.poster_path) {
            document.querySelectorAll('.' + className).forEach(img => {
                img.src = 'https://image.tmdb.org/t/p/w500' + (data.backdrop_path || data.poster_path);
            });
        }
    } catch (err) {}
}

/* ─────────────────────────────────────────────────────────────
   STICKY HEADER SCROLL EVENT
───────────────────────────────────────────────────────────── */
window.addEventListener('scroll', () => {
    const header = document.getElementById('app-header');
    if (!header) return;
    if (window.scrollY > 40) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

/* ─────────────────────────────────────────────────────────────
   STARTUP
───────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
    nav('home');
});
</script>
