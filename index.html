<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamMax Pro</title>
    <link rel="apple-touch-icon" href="Streammax.png">
    <link rel="icon" type="image/png" href="Streammax.png">
    <!-- DNS Prefetch and Preconnect Hints for performance optimization -->
    <link rel="dns-prefetch" href="https://api.themoviedb.org">
    <link rel="dns-prefetch" href="https://image.tmdb.org">
    <link rel="dns-prefetch" href="https://vidsrc-embed.ru">
    <link rel="dns-prefetch" href="https://vidsrc-embed.su">
    <link rel="dns-prefetch" href="https://embedmaster.link">
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="dns-prefetch" href="https://graphql.anilist.co">
    <link rel="dns-prefetch" href="https://proxy.corsfix.com">
    <link rel="dns-prefetch" href="https://megaplay.buzz">
    <link rel="dns-prefetch" href="https://anivexa-three.vercel.app">

    <script>
        tailwind = {
            config: {
                theme: {
                    extend: {
                        screens: {
                            'xs': '360px',
                            '2xl': '1536px',
                            '3xl': '1920px',
                            '4xl': '2560px',
                            '5xl': '3840px',
                        }
                    }
                }
            }
        };
        tailwind.config = tailwind.config;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800;1,900&display=swap');

        @media (min-width: 1920px) { html { font-size: 18px; } }
        @media (min-width: 2560px) { html { font-size: 22px; } }
        @media (min-width: 3840px) { html { font-size: 28px; } }
        @media (max-width: 320px) { html { font-size: 13px; } }

        body {
            background: #05020a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .accent { color: #a855f7; }
        .bg-accent { background-color: #7c3aed; color: #ffffff; }
        .text-accent-glow { text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

        .glass-header {
            background: rgba(8, 4, 15, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s ease-in-out;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }
        .glass-header.scrolled {
            background: rgba(11, 6, 22, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.25);
        }

        .card {
            background: #110826;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.25);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .shelf-container {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .shelf-container > * {
            scroll-snap-align: start;
        }

        /* Player & Server Knoppen */
        .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(139, 92, 246, 0.2); }
        .srv-btn { flex: 1; text-align: center; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 12px 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .srv-btn.active { background: #7c3aed; color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); border-color: #a855f7; }
        .srv-btn.inactive { background: #110826; color: #64748b; border-color: rgba(139, 92, 246, 0.2); }

        /* Episode Grid */
        .ep-btn { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 800; font-size: 14px; transition: all 0.2s; cursor: pointer; }
        .ep-current { background: #a855f7; color: white; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border: 2px solid #d8b4fe; }
        .ep-watched { background: #2a1354; color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }
        .ep-available { background: #1a0c3b; color: #94a3b8; border: 1px solid transparent; }
        .ep-available:hover { background: #3b1c7a; color: white; }
        .ep-future { background: #0a0514; color: #334155; cursor: not-allowed; }

        /* Inputs & Kaarten */
        .input-group { background: #110826; border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 14px; padding: 14px; color: white; outline: none; -webkit-appearance: none; }
        .poster-card { aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; background: #0e071b; position: relative; border: 1px solid rgba(255,255,255,0.05); display: block; cursor: pointer; transition: transform 0.2s; }
        .poster-card:active { transform: scale(0.96); }
        .img-cover { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .img-loaded { opacity: 1; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }

        #toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            z-index: 10000;
            pointer-events: none;
        }
        @media (min-width: 1536px) { #toast-container { max-width: 500px; } }
        @media (min-width: 2560px) { #toast-container { max-width: 650px; } }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        :fullscreen #app-header, :fullscreen #app-navigation,
        :-webkit-full-screen #app-header, :-webkit-full-screen #app-navigation,
        body.is-fullscreen #app-header, body.is-fullscreen #app-navigation {
            display: none !important;
        }

        /* Toggle Switch */
        .toggle-bg {
            background-color: #27272a;
            transition: background-color 0.2s ease;
        }
        input:checked + .toggle-bg {
            background-color: #7c3aed;
        }
        .toggle-dot {
            transition: transform 0.2s ease;
        }
        input:checked ~ .toggle-dot {
            transform: translateX(100%);
        }

        /* Video Player & Subtitles */
        ::cue {
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
        }
        #native-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body class="pb-32 relative">

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <!-- Glass Header -->

    <!-- AniTorrent Modal (StreamMax Purple Theme) -->
    <div id="anitorrent-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[10000] hidden flex items-center justify-center p-4">
        <div class="bg-[#110826] border border-purple-500/30 p-5 sm:p-6 rounded-2xl max-w-2xl w-full shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-purple-500/20 pb-4 mb-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-download text-purple-400 text-xl"></i>
                    <div>
                        <h3 class="text-base font-black uppercase text-white tracking-wide">AniTorrent / Magnet Bronnen</h3>
                        <p class="text-[10px] text-purple-300/70 font-bold">Selecteer een torrent om direct via WebTorrent P2P te streamen</p>
                    </div>
                </div>
                <button onclick="window.closeAniTorrentModal()" class="w-8 h-8 rounded-xl bg-purple-950 text-purple-300 hover:text-white flex items-center justify-center transition-all border border-purple-500/20">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Resolution Filter Tabs -->
            <div class="flex items-center gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar">
                <button id="anitorrent-filter-ALL" onclick="window.filterAniTorrentResults('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-black uppercase transition-all bg-purple-600 text-white border border-purple-400">
                    Alle (<span id="anitorrent-count-ALL">0</span>)
                </button>
                <button id="anitorrent-filter-1080p" onclick="window.filterAniTorrentResults('1080p')" class="px-3 py-1.5 rounded-xl text-xs font-black uppercase transition-all bg-purple-950 text-purple-300 hover:bg-purple-900 border border-purple-500/20">
                    1080p (<span id="anitorrent-count-1080p">0</span>)
                </button>
                <button id="anitorrent-filter-720p" onclick="window.filterAniTorrentResults('720p')" class="px-3 py-1.5 rounded-xl text-xs font-black uppercase transition-all bg-purple-950 text-purple-300 hover:bg-purple-900 border border-purple-500/20">
                    720p (<span id="anitorrent-count-720p">0</span>)
                </button>
                <button id="anitorrent-filter-480p" onclick="window.filterAniTorrentResults('480p')" class="px-3 py-1.5 rounded-xl text-xs font-black uppercase transition-all bg-purple-950 text-purple-300 hover:bg-purple-900 border border-purple-500/20">
                    480p (<span id="anitorrent-count-480p">0</span>)
                </button>
            </div>

            <!-- Torrent Results List -->
            <div id="anitorrent-results-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1 no-scrollbar">
                <!-- Dynamisch gevuld door JS -->
            </div>
        </div>
    </div>

    <!-- Confirmation Modal (StreamMax Purple Theme) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[10000] hidden items-center justify-center p-4">
        <div class="bg-[#110826] border border-purple-500/30 p-4 sm:p-6 2xl:p-8 rounded-2xl max-w-xs sm:max-w-sm w-full shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-black uppercase tracking-wider mb-2 text-white">Bevestigen</h3>
            <p id="confirm-message" class="text-purple-200/80 text-xs leading-relaxed mb-6"></p>
            <div class="flex gap-3">
                <button id="confirm-cancel-btn" class="flex-1 bg-purple-950 hover:bg-purple-900 border border-purple-500/30 py-3 rounded-xl text-xs font-black uppercase text-purple-200 transition-all">Annuleren</button>
                <button id="confirm-ok-btn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl text-xs font-black uppercase font-bold transition-all shadow-lg shadow-purple-600/30">Bevestigen</button>
            </div>
        </div>
    </div>

    <header id="app-header" class="fixed top-0 left-0 right-0 z-50 glass-header p-3 sm:p-4 lg:px-10 2xl:px-16 3xl:px-20">
        <div class="flex items-center justify-between max-w-7xl 2xl:max-w-[1600px] 3xl:max-w-[2000px] 4xl:max-w-[2560px] 5xl:max-w-[92vw] mx-auto">
            <div class="flex items-center gap-6 lg:gap-12">
                <button onclick="nav('home')" class="text-2xl lg:text-3xl 2xl:text-4xl 3xl:text-5xl font-black italic uppercase tracking-tighter text-purple-500 transition-transform hover:scale-105">STREAM<span class="text-white">MAX</span></button>
                <nav class="hidden md:flex items-center gap-6 2xl:gap-10 text-[11px] 2xl:text-sm 3xl:text-base font-black uppercase tracking-widest text-slate-400">
                    <button onclick="nav('home')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-home">Home</button>
                    <button onclick="nav('movies')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-movies">Films</button>
                    <button onclick="nav('tv')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-tv">Series</button>
                    <button onclick="nav('history')" class="hover:text-white transition-colors animate-fade-in" id="head-nav-history">Verder Kijken</button>

                </nav>
            </div>
            <div id="header-right-controls" class="flex gap-4 items-center">

            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="content" class="p-3 sm:p-4 pt-20 sm:pt-24 2xl:pt-32 max-w-7xl 2xl:max-w-[1600px] 3xl:max-w-[2000px] 4xl:max-w-[2560px] 5xl:max-w-[92vw] mx-auto min-h-[60vh]">

            <p class="text-xs uppercase tracking-widest text-slate-500 animate-pulse">Laden...</p>
        </div>

    <!-- Footer -->

            <div class="flex flex-col items-center text-center space-y-3">
                <!-- Subtitle / Japanese label -->

                    <span class="text-slate-400 font-extrabold tracking-wider">GEMAAKT DOOR</span>

                <!-- Main Title & Icon -->

                    <i class="fa-solid fa-clapperboard text-purple-400 text-2xl sm:text-4xl transition-transform group-hover:scale-110"></i>
                    <span class="text-white">DOUGH</span>
                    <span class="text-purple-400">ENTERTAINMENT</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs sm:text-base text-slate-500 group-hover:text-purple-300 transition-colors ml-1"></i>
                </div>
            </div>
        </a>
        <p class="text-[10px] text-slate-600 mt-6 tracking-widest uppercase font-semibold">© StreamMax Pro. Alle rechten voorbehouden.</p>
    </footer>

    <!-- Bottom Navigation for Mobile -->
    <nav id="app-navigation" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#08040f]/90 backdrop-blur-2xl rounded-2xl px-3 py-2 flex justify-around items-center shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-[100] border border-purple-500/20 md:hidden">
        <button onclick="nav('home')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-home" title="Home" aria-label="Home"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Home</span></button>
        <button onclick="nav('movies')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-movies" title="Films" aria-label="Films"><i class="fa-solid fa-film text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Films</span></button>
        <button onclick="nav('tv')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-tv" title="Series" aria-label="Series"><i class="fa-solid fa-tv text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Series</span></button>
        <button onclick="nav('history')" class="flex flex-col items-center justify-center min-w-[52px] min-h-[44px] py-1 px-2 nav-link text-slate-400 hover:text-white transition-all duration-200" id="nav-history" title="Historie" aria-label="Historie"><i class="fa-solid fa-clock-rotate-left text-base"></i><span class="text-[9px] font-black uppercase tracking-wider mt-1">Historie</span></button>

                </div>

                <!-- Relations / Franchise / Recommendations -->

function getStorageCache(key, maxAgeMs = 15 * 60 * 1000) {
            try {

                if (Date.now() - item.timestamp > maxAgeMs) {

            } catch (e) {

            }
        }

// --- sanitizeHTML ---
function sanitizeHTML(htmlString) {
            if (!htmlString) return '';
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const allowedTags = new Set(['B', 'I', 'EM', 'STRONG', 'P', 'BR', 'SPAN', 'A', 'UL', 'OL', 'LI', 'SMALL']);

            function clean(node) {
                const children = Array.from(node.childNodes);
                for (const child of children) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        clean(child);
                        if (!allowedTags.has(child.tagName)) {
                            if (child.tagName !== 'SCRIPT' && child.tagName !== 'STYLE') {
                                while (child.firstChild) {
                                    node.insertBefore(child.firstChild, child);
                                }
                            }
                            node.removeChild(child);
                        } else {
                            const attrs = Array.from(child.attributes);
                            for (const attr of attrs) {
                                if (child.tagName === 'A' && attr.name.toLowerCase() === 'href') {
                                    if (!/^(https?:\/\/|\/|#)/i.test(attr.value)) {
                                        child.removeAttribute('href');
                                    }
                                } else {
                                    child.removeAttribute(attr.name);
                                }
                            }
                            // Security Enhancement: Enforce target="_blank" and rel="noopener noreferrer" on allowed <a> tags to prevent reverse tabnabbing
                            if (child.tagName === 'A' && child.hasAttribute('href')) {
                                child.setAttribute('target', '_blank');
                                child.setAttribute('rel', 'noopener noreferrer');
                            }
                        }
                    }
                }
            }
            clean(doc.body);
            return doc.body.innerHTML;
        }

// --- gql ---
async function gql(query, vars, requireAuth = false, retries = 3) {
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (requireAuth && app.anilistToken) {
                headers['Authorization'] = 'Bearer ' + app.anilistToken;
            }
            try {
                const r = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ query, variables: vars })
                });

                // Check HTTP level 429 Rate Limit
                if (r.status === 429 && retries > 0) {
                    const retryAfterHeader = r.headers.get('Retry-After');
                    const retryAfter = retryAfterHeader ? parseInt(retryAfterHeader, 10) : 2;
                    console.warn(`AniList Rate Limited (HTTP 429). Waiting ${retryAfter}s before retry...`);
                    await new Promise(resolve => setTimeout(resolve, Math.max(retryAfter, 1) * 1000));
                    return gql(query, vars, requireAuth, retries - 1);
                }

                const json = await r.json();

                // Check GraphQL level 429 Rate Limit in errors array
                if (json && json.errors && Array.isArray(json.errors)) {
                    const isRateLimited = json.errors.some(err => err.status === 429 || (err.message && err.message.toLowerCase().includes('too many requests')));
                    if (isRateLimited && retries > 0) {
                        console.warn('AniList GraphQL Rate Limited. Waiting 2s before retry...');
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return gql(query, vars, requireAuth, retries - 1);
                    }
                }

                return json;
            } catch(e) {
                return null;
            }
        }

// --- buildMagnetLink ---
function buildMagnetLink(hash, name) {
            const tr = TRACKERS.map(t => "tr=" + encodeURIComponent(t)).join("&");
            const dn = name ? "&dn=" + encodeURIComponent(name) : "";
            return `magnet:?xt=urn:btih:${hash.toLowerCase()}${dn}&${tr}`;

// --- fetchAniTorrentResults ---
async function fetchAniTorrentResults(anilistId, targetEp) {
            let titles = [];

            if (detailsCache[anilistId] && detailsCache[anilistId].data && detailsCache[anilistId].data.Media) {
                const media = detailsCache[anilistId].data.Media;
                if (media.title) {
                    if (media.title.romaji) titles.push(media.title.romaji);
                    if (media.title.english) titles.push(media.title.english);
                }
            }

            if (titles.length === 0) {
                try {
                    const res = await gql(`query($id:Int){Media(id:$id){title{romaji english} format episodes}}`, {id: parseInt(anilistId)});
                    if (res && res.data && res.data.Media) {
                        const media = res.data.Media;
                        if (media.title.romaji) titles.push(media.title.romaji);
                        if (media.title.english) titles.push(media.title.english);
                    }
                } catch(e) {}
            }

            titles = [...new Set(titles)].filter(Boolean);
            if (titles.length === 0) return [];

            const epPadded = String(targetEp).padStart(2, "0");
            let rawResults = [];

            // 1. Query AnimeTosho JSON API
            for (const title of titles) {
                try {
                    const q = `${title} ${epPadded}`;
                    const url = `https://feed.animetosho.org/json?q=${encodeURIComponent(q)}`;
                    const res = await fetch(url);
                    if (res.ok) {
                        const items = await res.json();
                        if (Array.isArray(items)) {
                            items.forEach(item => {
                                if (item.info_hash) {
                                    rawResults.push({
                                        title: item.title,
                                        hash: item.info_hash,
                                        magnet: item.magnet_uri || buildMagnetLink(item.info_hash, item.title),
                                        torrent_url: item.torrent_url || null,
                                        link: item.link || null,
                                        size: item.total_size ? (item.total_size / (1024*1024)).toFixed(1) + " MB" : (item.size_bytes ? (item.size_bytes / (1024*1024)).toFixed(1) + " MB" : "Unknown size"),
                                        seeders: item.seeders ?? 0,
                                        leechers: item.leechers ?? 0,
                                        source: "AnimeTosho"
                                    });
                                }
                            });
                        }
                    }
                } catch(e) {}
            }

            // 2. Query Nyaa RSS API
            for (const title of titles) {
                try {
                    const q = `${title} ${epPadded}`;
                    const url = proxyM3u8(`https://nyaa.si/?page=rss&q=${encodeURIComponent(q)}&c=1_2&s=id&o=desc`);
                    const res = await fetch(url);
                    if (res.ok) {
                        const xmlText = await res.text();
                        const itemMatches = xmlText.match(/<item>[\s\S]*?<\/item>/g) || [];
                        itemMatches.forEach(itemXml => {
                            const titleMatch = itemXml.match(/<title>(.*?)<\/title>/);
                            const hashMatch = itemXml.match(/<nyaa:infoHash>(.*?)<\/nyaa:infoHash>/);
                            const seedersMatch = itemXml.match(/<nyaa:seeders>(.*?)<\/nyaa:seeders>/);
                            const leechersMatch = itemXml.match(/<nyaa:leecher[s]?>(.*?)<\/nyaa:leecher[s]?>/);
                            const sizeMatch = itemXml.match(/<nyaa:size>(.*?)<\/nyaa:size>/);

                            if (titleMatch && hashMatch) {
                                const cleanTitle = titleMatch[1].replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
                                const hash = hashMatch[1].trim();

                                let srcName = "Nyaa";
                                if (/subsplease/i.test(cleanTitle)) srcName = "SubsPlease";
                                else if (/toonshub/i.test(cleanTitle)) srcName = "ToonsHub";
                                else if (/yameii/i.test(cleanTitle) || /dub/i.test(cleanTitle)) srcName = "Yameii";
                                else if (/seadex/i.test(cleanTitle)) srcName = "SeaDex";

                                const linkMatch = itemXml.match(/<link>(.*?)<\/link>/);
                                rawResults.push({
                                    title: cleanTitle,
                                    hash: hash,
                                    magnet: buildMagnetLink(hash, cleanTitle),
                                    torrent_url: hash ? `https://storage.animetosho.org/torrent/${hash}/${encodeURIComponent(cleanTitle)}.torrent` : null,
                                    link: linkMatch ? linkMatch[1] : null,
                                    size: sizeMatch ? sizeMatch[1] : "Unknown size",
                                    seeders: seedersMatch ? parseInt(seedersMatch[1]) || 0 : 0,
                                    leechers: leechersMatch ? parseInt(leechersMatch[1]) || 0 : 0,
                                    source: srcName
                                });
                            }
                        });
                    }
                } catch(e) {}
            }

            // Deduplicate by info_hash
            const uniqueMap = new Map();
            rawResults.forEach(r => {
                const key = r.hash.toLowerCase();
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, r);
                } else {
                    const existing = uniqueMap.get(key);
                    if (r.seeders > existing.seeders) uniqueMap.set(key, r);
                }
            });

            let finalResults = Array.from(uniqueMap.values());

            // Detect resolutions
            finalResults.forEach(r => {
                if (/1080p|1920x1080/i.test(r.title)) r.resolution = "1080p";
                else if (/720p|1280x720/i.test(r.title)) r.resolution = "720p";
                else if (/480p|848x480|640x480/i.test(r.title)) r.resolution = "480p";
                else if (/2160p|4k/i.test(r.title)) r.resolution = "2160p";
                else r.resolution = "Unknown";
            });

            // Sort by seeders descending
            finalResults.sort((a, b) => b.seeders - a.seeders);
            return finalResults;
        }

// --- downloadVideoFile ---
window.downloadVideoFile = function(torrentUrl, magnetUrl, title) {
            window.showToast("Videobestand voorbehandelen voor download...", "info");
            const cleanTitle = (title || "Anime_Video").replace(/[^a-zA-Z0-9_.-]/g, "_");

            if (typeof WebTorrent !== "undefined") {
                const tempClient = new WebTorrent();
                const source = torrentUrl || magnetUrl;

                tempClient.add(source, { announce: TRACKERS }, function(torrent) {
                    if (typeof torrent.throttleUpload === "function") torrent.throttleUpload(0);
                    const file = torrent.files.find(f => /\.(mp4|mkv|webm)$/i.test(f.name)) || torrent.files[0];
                    if (file) {
                        file.getBlobURL((err, url) => {
                            if (!err && url) {
                                const a = document.createElement("a");
                                a.href = url;
                                a.download = file.name || (cleanTitle + ".mp4");
                                document.body.appendChild(a);
                                a.click();
                                a.remove();
                                window.showToast("Videobestand download gestart!", "success");
                            } else {
                                window.showToast("Downloaden via directe mirror...", "warning");
                                if (torrentUrl && /^https?:\/\//i.test(torrentUrl)) window.open(torrentUrl, "_blank", "noopener,noreferrer");
                            }
                            tempClient.destroy(() => {});
                        });
                    } else {
                        window.showToast("Geen videobestand gevonden in torrent.", "error");
                        tempClient.destroy(() => {});
                    }
                });

                tempClient.on("error", function() {
                    window.showToast("Directe download via netwerk starten...", "info");
                    if (torrentUrl && /^https?:\/\//i.test(torrentUrl)) window.open(torrentUrl, "_blank", "noopener,noreferrer");
                    tempClient.destroy(() => {});
                });
            } else if (torrentUrl && /^https?:\/\//i.test(torrentUrl)) {
                window.open(torrentUrl, "_blank", "noopener,noreferrer");
            } else {
                window.showToast("Download niet mogelijk: Geen actieve client.", "error");
            }
        }

            if (!isFs) {

// --- exitFullscreenIfActive ---
function exitFullscreenIfActive(keepRestoreFlag = false) {
            const fsElement = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            window.shouldRestoreFullscreen = fsElement ? !!keepRestoreFlag : false;
            if (fsElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => console.warn("Exit fullscreen failed:", err));
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

// --- skipIntroTime ---
window.skipIntroTime = function() {
            currentPlaybackTime += app.skipSeconds;
            if (app.server === 'megaplay' || document.getElementById('player').classList.contains('block')) {
                const player = document.getElementById('player');
                if (player && player.contentWindow) {
                    // Security enhancement: Restrict postMessage targetOrigin to exact iframe origin to prevent cross-origin data leaks
                    let targetOrigin = "*";
                    if (player.src) {
                        try {
                            const parsedUrl = new URL(player.src);
                            if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                                targetOrigin = parsedUrl.origin;
                            }
                        } catch (e) {}
                    }
                    player.contentWindow.postMessage(JSON.stringify({ event: "command", command: "seek", value: currentPlaybackTime }), targetOrigin);
                }
            } else {
                const video = document.getElementById('native-player');
                if (video) video.currentTime = currentPlaybackTime;
            }
            window.showToast(`Geskipt (+${app.skipSeconds}s)`);
        }

window.openInVLC = function() {
            if (app.server === 'megaplay') {
                window.showToast("MegaPlay is een ingesloten video en kan niet geopend worden in VLC. Schakel over naar een Direct/HLS server!", "error");
                return;
            }
            if (!window.currentM3u8Url) {
                window.showToast("Er is op dit moment geen directe video of .m3u8 bron geladen.", "error");
                return;
            }
            // Security: Enforce strict http/https scheme validation on stream URL before triggering custom VLC protocol launch
            if (!/^https?:\/\//i.test(window.currentM3u8Url)) {
                window.showToast("Onveilige of ongeldige video-URL voor VLC.", "error");
                return;
            }
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const vlcUrl = isMobile
                ? "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(window.currentM3u8Url)
                : "vlc://" + window.currentM3u8Url;
            window.location.href = vlcUrl;
            window.showToast("VLC Player aangeroepen! Zorg ervoor dat de VLC-app is geïnstalleerd.", "success");
        }

// --- renderFilterLabel ---
window.renderFilterLabel = function(key, defaultTitle) {
            const filterKey = key === 'genre' ? 'genres' : (key === 'type' ? 'format' : key);
            const val = app.searchFilters[filterKey];
            if (Array.isArray(val)) {
                if (val.length === 0) return defaultTitle;
                if (val.length === 1) return escapeHTML(val[0]);
                return `${escapeHTML(val[0])} <span class="bg-[#cae962] text-black text-[9px] font-black px-1.5 py-0.5 rounded-full ml-1">+${val.length - 1}</span>`;
            }
            if (!val || val === 'POPULARITY_DESC') return defaultTitle;
            if (filterKey === 'country') {
                const found = FILTER_OPTIONS.country.find(c => c.code === val);
                return found ? found.label : defaultTitle;
            }
            if (filterKey === 'season') {
                const found = FILTER_OPTIONS.season.find(s => s.val === val);
                return found ? found.label : defaultTitle;
            }
            if (filterKey === 'sort') {
                const found = FILTER_OPTIONS.sorts.find(s => s.val === val);
                return found ? found.label : defaultTitle;
            }
            return escapeHTML(String(val));

// --- liveSearch ---
window.liveSearch = function(e, resetPage = true) {
            const requestId = ++currentSearchRequestId;
            const q = e && e.target ? e.target.value.trim() : (app.searchQuery || '').trim();
            app.searchQuery = q;
            if (resetPage) {
                app.searchPage = 1;
            }
            clearTimeout(searchTimeout);
            const grid = document.getElementById('search-grid');
            const paginationContainer = document.getElementById('search-pagination');
            if (!grid) return;

            const f = app.searchFilters || {};
            const page = app.searchPage || 1;
            const hasFilters = (f.genres && f.genres.length > 0) || f.country || f.season || f.year || (f.format && f.format.length > 0) || (f.status && f.status.length > 0) || (f.sort && f.sort !== 'POPULARITY_DESC');

            if (q.length < 3 && !hasFilters) {
                grid.innerHTML = '<p class="col-span-full text-center text-zinc-500 text-xs mt-10">Typ 3 of meer letters of kies een filter...</p>';
                if (paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            const cacheKey = JSON.stringify({ q, f, page });

            const renderSearchResults = (res) => {
                if (requestId !== currentSearchRequestId) return;
                grid.innerHTML = '';
                if (res && res.data && res.data.Page && res.data.Page.media && res.data.Page.media.length) {
                    res.data.Page.media.forEach(m => {
                        const titleText = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                        const safeTitle = escapeHTML(titleText);
                        grid.innerHTML += `
                            <div onclick="openDetailsModal('${m.id}')" class="text-left group cursor-pointer animate-fade-in relative">
                                <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5 relative bg-zinc-800">
                                    <img src="${escapeHTML(m.coverImage.large)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                                    ${m.averageScore ? `<span class="absolute top-2 left-2 bg-black/85 text-accent text-[8px] font-black px-1.5 py-0.5 rounded shadow"><i class="fa-solid fa-star text-[7px] mr-1 text-[#cae962]"></i> ${m.averageScore/10}</span>` : ''}
                                </div>
                                <p class="text-[10px] font-black uppercase truncate text-zinc-400 group-hover:text-white pl-1" title="${safeTitle}">${safeTitle}</p>
                            </div>`;
                    });

                    // Render pagination
                    if (paginationContainer && res.data.Page.pageInfo) {
                        const pageInfo = res.data.Page.pageInfo;
                        const totalPages = pageInfo.lastPage || 1;
                        const curr = pageInfo.currentPage || page;

                        if (totalPages <= 1) {
                            paginationContainer.innerHTML = '';
                            return;
                        }

                        let pagesToShow = [];
                        pagesToShow.push(1);

                        let start = Math.max(2, curr - 2);
                        let end = Math.min(totalPages - 1, curr + 2);

                        if (start > 2) pagesToShow.push('...');
                        for (let p = start; p <= end; p++) {
                            if (!pagesToShow.includes(p)) pagesToShow.push(p);
                        }
                        if (end < totalPages - 1) pagesToShow.push('...');
                        if (totalPages > 1 && !pagesToShow.includes(totalPages)) pagesToShow.push(totalPages);

                        let pagHtml = `
                            <div class="flex items-center justify-center gap-1.5 sm:gap-2 flex-wrap text-xs font-bold pt-4">
                                <button onclick="changeSearchPage(${curr - 1})" ${curr <= 1 ? 'disabled class="opacity-40 cursor-not-allowed bg-zinc-900 border border-white/5 text-zinc-500 px-3 py-2 rounded-xl flex items-center gap-1.5"' : 'class="bg-zinc-900 border border-white/10 hover:border-[#cae962] text-zinc-300 hover:text-white px-3 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer"'} aria-label="Vorige pagina">
                                    <i class="fa-solid fa-chevron-left text-[10px]"></i> Vorige
                                </button>
                        `;

                        pagesToShow.forEach(p => {
                            if (p === '...') {
                                pagHtml += `<span class="px-2 py-1 text-zinc-600 font-bold">...</span>`;
                            } else if (p === curr) {
                                pagHtml += `<button class="bg-[#cae962] text-black font-black px-3.5 py-2 rounded-xl shadow-lg shadow-[#cae962]/20 cursor-default" aria-label="Pagina ${p}">${p}</button>`;
                            } else {
                                pagHtml += `<button onclick="changeSearchPage(${p})" class="bg-zinc-900 border border-white/10 hover:border-[#cae962] text-zinc-300 hover:text-white px-3.5 py-2 rounded-xl transition cursor-pointer" aria-label="Ga naar pagina ${p}">${p}</button>`;
                            }
                        });

                        pagHtml += `
                                <button onclick="changeSearchPage(${curr + 1})" ${curr >= totalPages ? 'disabled class="opacity-40 cursor-not-allowed bg-zinc-900 border border-white/5 text-zinc-500 px-3 py-2 rounded-xl flex items-center gap-1.5"' : 'class="bg-zinc-900 border border-white/10 hover:border-[#cae962] text-zinc-300 hover:text-white px-3 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer"'} aria-label="Volgende pagina">
                                    Volgende <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                </button>
                            </div>
                        `;

                        paginationContainer.innerHTML = pagHtml;
                    }
                } else {
                    grid.innerHTML = '<p class="col-span-full text-center text-zinc-500 text-xs mt-10">Niets gevonden.</p>';
                    if (paginationContainer) paginationContainer.innerHTML = '';
                }
            };

            if (searchCache[cacheKey]) {
                renderSearchResults(searchCache[cacheKey]);
                return;
            }

            grid.innerHTML = '<div class="col-span-full text-center text-[#cae962] text-xs mt-10"><i class="fa-solid fa-circle-notch animate-spin"></i> Zoeken...</div>';
            if (paginationContainer) paginationContainer.innerHTML = '';

            searchTimeout = setTimeout(async () => {
                const variables = { page: page, perPage: 24 };
                if (q.length >= 3) variables.search = q;
                if (f.genres && f.genres.length) variables.genre_in = f.genres;
                if (f.country) variables.countryOfOrigin = f.country;
                if (f.season) variables.season = f.season;
                if (f.year) variables.seasonYear = parseInt(f.year, 10);
                if (f.format && f.format.length) variables.format_in = f.format;
                if (f.status && f.status.length) variables.status_in = f.status;
                variables.sort = f.sort ? [f.sort] : ['POPULARITY_DESC'];

                const varDefs = ['$page: Int', '$perPage: Int'];
                if (variables.search) varDefs.push('$search: String');
                if (variables.genre_in) varDefs.push('$genre_in: [String]');
                if (variables.countryOfOrigin) varDefs.push('$countryOfOrigin: CountryCode');
                if (variables.season) varDefs.push('$season: MediaSeason');
                if (variables.seasonYear) varDefs.push('$seasonYear: Int');
                if (variables.format_in) varDefs.push('$format_in: [MediaFormat]');
                if (variables.status_in) varDefs.push('$status_in: [MediaStatus]');
                if (variables.sort) varDefs.push('$sort: [MediaSort]');

                const varStr = varDefs.length ? `(${varDefs.join(', ')})` : '';
                const fieldArgs = [
                    'type: ANIME',
                    variables.search ? 'search: $search' : '',
                    variables.genre_in ? 'genre_in: $genre_in' : '',
                    variables.countryOfOrigin ? 'countryOfOrigin: $countryOfOrigin' : '',
                    variables.season ? 'season: $season' : '',
                    variables.seasonYear ? 'seasonYear: $seasonYear' : '',
                    variables.format_in ? 'format_in: $format_in' : '',
                    variables.status_in ? 'status_in: $status_in' : '',
                    variables.sort ? 'sort: $sort' : ''
                ].filter(Boolean).join(', ');

                const query = `query ${varStr} { Page(page: $page, perPage: $perPage) { pageInfo { total currentPage lastPage hasNextPage } media(${fieldArgs}) { id title { romaji english } coverImage { large } averageScore genres tags { name } isAdult } } }`;

                const res = await gql(query, variables);
                if (requestId !== currentSearchRequestId) return;
                if (res) {
                    searchCache[cacheKey] = res;
                    setStorageCache('searchCache', searchCache);
                }
                renderSearchResults(res);
            }, resetPage ? 350 : 0);
        }

// --- getAgeRating ---
function getAgeRating(m) {
            if (!m) return { code: "PG-13", age: 13, isAdult: false, shortDesc: "13+", explanation: "13+ Teens and Older" };
            const isAdult = m.isAdult === true;
            const genres = (m.genres || []).map(g => String(g).toLowerCase());
            let tags = [];
            if (Array.isArray(m.tags)) {
                tags = m.tags.map(t => (typeof t === "string" ? t : (t.name || "")).toLowerCase());
            }

            if (isAdult || genres.includes("hentai") || tags.includes("hentai")) {
                return { code: "Rx", age: 18, isAdult: true, shortDesc: "18+ Uncen", explanation: "18+ Uncensored / Explicit Adult Content" };
            }
            if (genres.includes("ecchi") || tags.includes("ecchi") || tags.includes("nudity") || tags.includes("erotica")) {
                return { code: "R+", age: 18, isAdult: false, shortDesc: "18+ Cen", explanation: "18+ Censored / Mild Nudity & Erotica" };
            }
            if (genres.includes("horror") || tags.includes("gore") || tags.includes("blood") || tags.includes("violence") || tags.includes("horror") || tags.includes("psychological")) {
                return { code: "R", age: 17, isAdult: false, shortDesc: "17+ / 18+ Cen", explanation: "17+ Mild Gore / Violence / Horror" };
            }
            if (genres.includes("kids") || tags.includes("kids") || tags.includes("children")) {
                return { code: "G", age: 0, isAdult: false, shortDesc: "G / All", explanation: "G - All Ages / Children" };
            }
            if (tags.includes("shounen") || tags.includes("family") || genres.includes("slice of life") || genres.includes("sports")) {
                return { code: "PG", age: 10, isAdult: false, shortDesc: "PG / 10+", explanation: "PG - Children & Family (10+)" };
            }
            return { code: "PG-13", age: 13, isAdult: false, shortDesc: "13+", explanation: "13+ Teens and Older" };
        }

// --- isAnimeBlocked ---
function isAnimeBlocked(m) {
            if (!app.ageFilterEnabled) return false;
            if (!m) return false;
            if (app.ageFilterLevel === "NO_RESTRICTION") return false;

            const levelRanks = { "G": 1, "PG": 2, "PG-13": 3, "R": 4, "R+": 5, "Rx": 6, "NO_RESTRICTION": 7 };
            const maxRank = levelRanks[app.ageFilterLevel] || 7;
            const rateInfo = getAgeRating(m);
            const animeRank = levelRanks[rateInfo.code] || 1;
            return animeRank > maxRank;
        }

// --- syncAniListListToLocal ---
window.syncAniListListToLocal = async function(manualToast = true) {
            if (!app.anilistToken) {
                if (manualToast) window.showToast("Log eerst in met AniList!", "error");
                return;
            }
            if (manualToast) window.showToast("AniList bibliotheek synchroniseren...");

            try {
                const viewerRes = await gql(`query { Viewer { id name avatar { large } } }`);
                if (!viewerRes || !viewerRes.data || !viewerRes.data.Viewer) {
                    if (manualToast) window.showToast("Kon AniList profiel niet ophalen.", "error");
                    return;
                }
                const viewer = viewerRes.data.Viewer;
                app.anilistProfile = {
                    name: viewer.name,
                    avatar: viewer.avatar.large
                };

                const listRes = await gql(`
                    query ($userId: Int) {
                        MediaListCollection(userId: $userId, type: ANIME) {
                            lists {
                                name
                                status
                                entries {
                                    id
                                    status
                                    progress
                                    media {
                                        id
                                        title {
                                            romaji
                                            english
                                        }
                                        episodes
                                        coverImage {
                                            large
                                        }
                                    }
                                }
                            }
                        }
                    }
                `, { userId: viewer.id }, true);

                if (!listRes || !listRes.data || !listRes.data.MediaListCollection) {
                    if (manualToast) window.showToast("Kon AniList lijst niet ophalen.", "error");
                    return;
                }

                const lists = listRes.data.MediaListCollection.lists;
                const aniListEntries = [];
                lists.forEach(list => {
                    if (list.entries) {
                        list.entries.forEach(entry => {
                            if (entry && entry.media) {
                                aniListEntries.push(entry);
                            }
                        });
                    }
                });

                const alStatusMap = {
                    'CURRENT': 'Watching',
                    'PLANNING': 'Plan to Watch',
                    'COMPLETED': 'Watched',
                    'DROPPED': 'Dropped',
                    'PAUSED': 'Watching'
                };

                const localToAlStatusMap = {
                    'Watching': 'CURRENT',
                    'Plan to Watch': 'PLANNING',
                    'Watched': 'COMPLETED',
                    'Completed': 'COMPLETED',
                    'Dropped': 'DROPPED'
                };

                let localLib = [...app.xmlLib];
                const aniListMap = {};
                aniListEntries.forEach(entry => {
                    aniListMap[entry.media.id.toString()] = entry;
                });

                const toPushToAniList = [];
                let pulledCount = 0;

                // 1. Process existing local items against AniList
                localLib = localLib.map(localItem => {
                    if (!localItem || !localItem.id) return localItem;
                    const mediaIdStr = localItem.id.toString();
                    const aniItem = aniListMap[mediaIdStr];

                    if (aniItem) {
                        const aniProgress = aniItem.progress || 0;
                        const localProgress = localItem.progress || 0;

                        if (localProgress > aniProgress) {
                            // Local is ahead. Push to AniList.
                            toPushToAniList.push({
                                id: mediaIdStr,
                                progress: localProgress,
                                status: localToAlStatusMap[localItem.status] || 'CURRENT'
                            });
                            return localItem;
                        } else if (aniProgress > localProgress) {
                            // AniList is ahead. Pull to local.
                            pulledCount++;
                            return {
                                ...localItem,
                                progress: aniProgress,
                                status: alStatusMap[aniItem.status] || 'Watching'
                            };
                        } else {
                            // Progress is equal. Align status.
                            const mappedAniStatus = alStatusMap[aniItem.status] || 'Watching';
                            if (localItem.status !== mappedAniStatus) {
                                if (localItem.status === 'Watched' || localItem.status === 'Completed') {
                                    toPushToAniList.push({
                                        id: mediaIdStr,
                                        progress: localProgress,
                                        status: 'COMPLETED'
                                    });
                                    return localItem;
                                } else if (mappedAniStatus === 'Watched' || mappedAniStatus === 'Completed') {
                                    pulledCount++;
                                    return {
                                        ...localItem,
                                        status: 'Watched'
                                    };
                                } else {
                                    pulledCount++;
                                    return {
                                        ...localItem,
                                        status: mappedAniStatus
                                    };
                                }
                            }
                            return localItem;
                        }
                    } else {
                        // Local-only. Push to AniList.
                        toPushToAniList.push({
                            id: mediaIdStr,
                            progress: localItem.progress || 0,
                            status: localToAlStatusMap[localItem.status] || 'CURRENT'
                        });
                        return localItem;
                    }
                });

                // 2. Add AniList-only items to local
                aniListEntries.forEach(entry => {
                    const mediaIdStr = entry.media.id.toString();
                    const existsLocally = localLib.some(item => item && item.id.toString() === mediaIdStr);

                    if (!existsLocally) {
                        const media = entry.media;
                        const title = app.lang === 'english' ? (media.title.english || media.title.romaji) : (media.title.romaji || media.title.english);
                        localLib.push({
                            id: mediaIdStr,
                            title: title,
                            status: alStatusMap[entry.status] || 'Watching',
                            progress: entry.progress || 0,
                            episodes: media.episodes || 12,
                            coverImage: media.coverImage ? media.coverImage.large : ''
                        });
                        pulledCount++;
                    }
                });

                // 3. Push local changes to AniList
                let pushedCount = 0;
                if (toPushToAniList.length > 0) {
                    for (const item of toPushToAniList) {
                        try {
                            const mutation = `mutation ($mediaId: Int, $progress: Int, $status: MediaListStatus) { SaveMediaListEntry (mediaId: $mediaId, progress: $progress, status: $status) { id status progress } }`;
                            await gql(mutation, {
                                mediaId: parseInt(item.id),
                                progress: parseInt(item.progress),
                                status: item.status
                            }, true);
                            pushedCount++;
                        } catch (err) {
                            console.warn("Synchroniseren van item naar AniList mislukt.");
                        }
                    }
                }

                app.xmlLib = localLib;
                await saveCloudData();
                render();

                if (manualToast) {
                    window.showToast(`Sync voltooid! ${pulledCount} binnengehaald, ${pushedCount} gepusht naar AniList.`, "success");
                }
            } catch (e) {
                console.warn("AniList synchronisatie mislukt.");
                if (manualToast) window.showToast("Fout bij synchroniseren met AniList.", "error");
            }
        }

// --- handleAvatarFileUpload ---
window.handleAvatarFileUpload = function(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type.toLowerCase())) {
                window.showToast("Ongeldig bestandstype. Kies een PNG, JPG, GIF of WEBP afbeelding.", "error");
                e.target.value = '';
                return;
            }

            const maxSize = 2 * 1024 * 1024;
            if (file.size > maxSize) {
                window.showToast("Bestand is te groot! Maximale grootte is 2MB.", "error");
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const dataUrl = event.target.result;
                if (isValidAvatarUrl(dataUrl)) {
                    app.avatar = dataUrl;
                    saveCloudDataDebounced();
                    window.showToast("Profielfoto succesvol geüpload!");
                    render();
                } else {
                    window.showToast("Ongeldige of onveilige afbeeldingsdata.", "error");
                }
            };
            reader.readAsDataURL(file);
        }

// --- isValidAvatarUrl ---
function isValidAvatarUrl(url) {
            if (!url || typeof url !== 'string') return false;
            const trimmed = url.trim();
            if (!trimmed) return false;

            const lower = trimmed.toLowerCase();
            if (lower.includes('javascript:') || lower.includes('vbscript:') || lower.includes('<script') || lower.includes('data:text/html')) {
                return false;
            }

            if (lower.startsWith('data:')) {
                const dataUrlRegex = /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=]+$/i;
                return dataUrlRegex.test(trimmed);
            }

            try {
                const parsed = new URL(trimmed);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

const renderHomeFeeds = (res) => {
                    if(!res || !res.data) return;

                    clearInterval(heroInterval);
                    const tData = res.data.trending.media;
                    if(tData.length > 0) {
                        const top10 = tData.slice(0, 10);
                        let currentHeroIdx = 0;

                        const updateHeroSlide = (idx) => {
                            currentHeroIdx = idx;
                            const hero = top10[idx];
                            if (!hero) return;
                            const ht = app.lang === 'english' ? (hero.title.english || hero.title.romaji) : hero.title.romaji;

                            const badgeEl = document.getElementById('hero-badge');
                            if (badgeEl) badgeEl.innerText = `Populairste Nu #${idx + 1}`;

                            if (titleEl) titleEl.innerText = ht;

                            const descEl = document.getElementById('hero-desc');

                            const imgEl = document.getElementById('hero-img');
                            if (imgEl) imgEl.src = hero.bannerImage || hero.coverImage.extraLarge;

                            const playBtn = document.getElementById('hero-play');
                            if (playBtn) playBtn.onclick = () => nav('watch', {id: hero.id, ep: 1});

                            const infoBtn = document.getElementById('hero-info');
                            if (infoBtn) infoBtn.onclick = () => openDetailsModal(hero.id);

                            const indContainer = document.getElementById('hero-indicators');
                            if (indContainer) {
                                let indHtml = '';
                                top10.forEach((_, i) => {
                                    const active = i === idx;
                                    indHtml += `<button onclick="event.stopPropagation(); window.switchHeroSlide(${i});" class="shrink-0 h-2.5 rounded-full transition-all duration-300 ${active ? 'w-7 bg-[#cae962]' : 'w-2.5 bg-white/30 hover:bg-white/60'}" aria-label="Slide ${i+1}"></button>`;
                                });
                                indContainer.innerHTML = indHtml;

                                const activeBtn = indContainer.children[idx];
                                if (activeBtn) {
                                    indContainer.scrollTo({
                                        left: activeBtn.offsetLeft - (indContainer.clientWidth / 2) + (activeBtn.clientWidth / 2),
                                        behavior: 'smooth'
                                    });
                                }
                            }
                        };

                        window.switchHeroSlide = (idx) => {
                            clearInterval(heroInterval);
                            updateHeroSlide(idx);
                            startHeroTimer();
                        };

                        window.nextHeroSlide = () => {
                            clearInterval(heroInterval);
                            const nextIdx = (currentHeroIdx + 1) % top10.length;
                            updateHeroSlide(nextIdx);
                            startHeroTimer();
                        };

                        window.prevHeroSlide = () => {
                            clearInterval(heroInterval);
                            const prevIdx = (currentHeroIdx - 1 + top10.length) % top10.length;
                            updateHeroSlide(prevIdx);
                            startHeroTimer();
                        };

                        const startHeroTimer = () => {
                            clearInterval(heroInterval);
                            heroInterval = setInterval(() => {
                                const nextIdx = (currentHeroIdx + 1) % top10.length;
                                updateHeroSlide(nextIdx);
                            }, 6000);
                        };

                        updateHeroSlide(0);
                        startHeroTimer();

                        const heroContainer = document.getElementById('home-hero');
                        if (heroContainer) {
                            heroContainer.onmouseenter = () => clearInterval(heroInterval);
                            heroContainer.onmouseleave = () => startHeroTimer();

                            let touchStartX = 0;
                            let touchStartY = 0;
                            let touchEndX = 0;
                            let touchEndY = 0;

                            heroContainer.addEventListener('touchstart', (e) => {
                                if (e.target.closest('button')) return;
                                touchStartX = e.changedTouches[0].clientX;
                                touchStartY = e.changedTouches[0].clientY;
                            }, { passive: true });

                            heroContainer.addEventListener('touchend', (e) => {
                                if (e.target.closest('button')) return;
                                touchEndX = e.changedTouches[0].clientX;
                                touchEndY = e.changedTouches[0].clientY;

                                const deltaX = touchEndX - touchStartX;
                                const deltaY = touchEndY - touchStartY;

                                // Require minimum horizontal distance of 40px and horizontal swipe priority over vertical scroll
                                if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
                                    if (deltaX < 0) {
                                        window.nextHeroSlide();
                                    } else {
                                        window.prevHeroSlide();
                                    }
                                }
                            }, { passive: true });
                        }

                        const trendShelf = document.getElementById('home-trending');

                                    </div>

                                </div>`;

                        trendShelf.innerHTML = trendHtml + `</div>`;

// --- autoUpdateProgressOnEpClick ---
window.autoUpdateProgressOnEpClick = function(id, title, ep, total, img, customStat = null) {
            let found = false;
            const ex = app.xmlLib.find(i => i && i.id == id);
            let finalStat = customStat ? customStat : (ex ? (ex.status === "Dropped" ? "Dropped" : (ep >= total ? "Watched" : ex.status)) : (ep >= total ? "Watched" : "Watching"));

            app.xmlLib = app.xmlLib.map(i => {
                if (i && i.id == id) { found = true; return { ...i, status: finalStat, progress: parseInt(ep), episodes: total, coverImage: img || i.coverImage }; }
                return i;
            });
            if (!found) app.xmlLib.push({ id: id.toString(), title, status: finalStat, progress: parseInt(ep), episodes: total, coverImage: img });

            saveCloudDataDebounced();
            window.syncProgressToAniList(id, ep, finalStat);
        }

// --- updateProgressUI ---
window.updateProgressUI = function(seconds, duration) {
            currentPlaybackTime = parseFloat(seconds);
            if (duration !== undefined && duration > 0) currentDuration = parseFloat(duration);

            const timeText = document.getElementById('playback-time-text');
            const percentageText = document.getElementById('playback-progress-percentage');
            if (timeText) timeText.innerText = `${formatDuration(currentPlaybackTime)} / ${formatDuration(currentDuration)}`;
            if (percentageText && currentDuration > 0) {
                const pct = Math.round((currentPlaybackTime / currentDuration) * 100);
                percentageText.innerText = `${pct}%`;
            }

            const isNearEnd = (currentDuration > 10 && currentPlaybackTime >= currentDuration - 2.5);
            if (isNearEnd) {
                if (autoNextTriggered) return;
                autoNextTriggered = true;
                setTimeout(() => { autoNextTriggered = false; }, 8000);
                if (app.autoNext) window.playNextEpisode();
            }
        }

// --- saveRecent ---
window.saveRecent = function(id, title, img, ep) {
            let rec = app.recent.filter(i => i && i.id != id);
            rec.unshift({ id, title, img, ep, time: currentPlaybackTime || 0, duration: currentDuration || 0, ts: Date.now() });
            app.recent = rec.slice(0, 50);
            saveCloudDataDebounced();
        }

                            const ht = app.lang === 'english' ? (hero.title.english || hero.title.romaji) : hero.title.romaji;

window.renderWatchEpisodeButtons = function(totalEps, releasedEpsCount, currentProg, activeEp) {

                }
            } else {
                const activeChunkIndex = Math.floor((activeEp - 1) / chunkSize);

                window.renderWatchEpisodeChunk = function(chunkIdx) {
                    const start = chunkIdx * chunkSize + 1;
                    const end = Math.min(start + chunkSize - 1, releasedEpsCount);

                    let buttonsHtml = '';
                    for (let i = start; i <= end; i++) {
                        let c = (i == activeEp) ? "bg-[#cae962] text-black font-bold font-black" : (i <= currentProg ? "bg-emerald-800 text-emerald-100 hover:bg-emerald-700" : "bg-zinc-800 text-zinc-400 hover:bg-zinc-700");

                    }

                    if (buttonsContainer) buttonsContainer.innerHTML = buttonsHtml;
                };

                let selectHtml = `<select onchange="window.renderWatchEpisodeChunk(parseInt(this.value))" class="col-span-full bg-zinc-900 border border-white/10 p-3 rounded-xl text-xs font-black uppercase text-white outline-none mb-2">`;
                for (let c = 0; c < Math.ceil(releasedEpsCount / chunkSize); c++) {
                    const start = c * chunkSize + 1;
                    const end = Math.min(start + chunkSize - 1, releasedEpsCount);
                    const isSelected = (c === activeChunkIndex) ? 'selected' : '';
                    selectHtml += `<option value="${c}" ${isSelected}>Afleveringen ${start} - ${end}</option>`;
                }
                selectHtml += `</select>`;

                grid.innerHTML = selectHtml + `<div id="ep-buttons-container" class="col-span-full grid grid-cols-4 xs:grid-cols-5 sm:grid-cols-10 md:grid-cols-12 2xl:grid-cols-15 3xl:grid-cols-20 gap-2"></div>`;
                window.renderWatchEpisodeChunk(activeChunkIndex);
            }
        }

window.exportBackup = function() {
    const data = {
        appState: {
            user: app.user,
            avatar: app.avatar,
            ageFilterEnabled: app.ageFilterEnabled,
            ageFilterLevel: app.ageFilterLevel,
            autoNext: app.autoNext,
            autoPlay: app.autoPlay,
            skipSeconds: app.skipSeconds,
            defaultAudio: app.defaultAudio
        },
        recent: app.recent || [],
        xmlLib: app.xmlLib || [],
        exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `streammax-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    if (typeof showToast === 'function') showToast("Backup succesvol geëxporteerd!", "success");
};

window.importBackup = function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.recent && Array.isArray(data.recent)) app.recent = data.recent;
            if (data.xmlLib && Array.isArray(data.xmlLib)) app.xmlLib = data.xmlLib;
            if (data.appState) {
                if (data.appState.user) app.user = data.appState.user;
                if (data.appState.avatar) app.avatar = data.appState.avatar;
                if (data.appState.ageFilterLevel) app.ageFilterLevel = data.appState.ageFilterLevel;
            }
            localStorage.setItem('sm_progress', JSON.stringify(app.recent));
            if (typeof showToast === 'function') showToast("Backup succesvol geïmporteerd!", "success");
            if (typeof render === 'function') render();
        } catch (err) {
            if (typeof showToast === 'function') showToast("Ongeldig backup bestand!", "error");
        }
    };
    reader.readAsText(file);
};

window.clearHistory = function() {
    const doClear = () => {
        app.recent = [];
        localStorage.removeItem('sm_progress');
        localStorage.removeItem('streammax:progress');
        if (typeof showToast === 'function') showToast("Geschiedenis gewist!", "info");
        if (typeof render === 'function') render();
    };
    if (typeof showConfirm === 'function') {
        showConfirm("Geschiedenis Wissen", "Weet u zeker dat u uw gehele kijkgeschiedenis wilt wissen?", doClear);
    } else {
        if (confirm("Weet u zeker dat u uw kijken geschiedenis wilt wissen?")) doClear();
    }
};

function nav(viewName, params = {}) {
    app.view = viewName;

    // Header & Mobile Nav active states
    document.querySelectorAll('#app-header nav button').forEach(el => {
        el.classList.remove('text-purple-400');
        el.classList.add('text-slate-400');
    });
    let headActive = document.getElementById('head-nav-' + viewName);
    if (headActive) {
        headActive.classList.add('text-purple-400');
        headActive.classList.remove('text-slate-400');
    }

    document.querySelectorAll('#app-navigation .nav-link').forEach(el => {
        el.classList.remove('text-purple-400');
        el.classList.add('text-slate-400');
    });
    let mobileActive = document.getElementById('nav-' + viewName);
    if (mobileActive) {
        mobileActive.classList.add('text-purple-400');
        mobileActive.classList.remove('text-slate-400');
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (viewName === 'player') {
        if (params.id) {
            app.mediaId = decodeURIComponent(String(params.id)).trim();
            app.tmdbId = app.mediaId;
            app.type = params.type ? decodeURIComponent(String(params.type)) : 'movie';
            app.season = parseInt(params.s) || 1;
            app.episode = parseInt(params.e) || 1;
            app.srv = params.srv ? decodeURIComponent(String(params.srv)) : '1';
        }
        renderPlayerPage();
    } else if (viewName === 'movies') {
        renderGridPage('movies');
    } else if (viewName === 'tv') {
        renderGridPage('tv');
    } else if (viewName === 'history') {
        renderHistoryPage();
    } else if (viewName === 'settings') {
        renderSettingsPage();
    } else if (viewName === 'search') {
        renderSearchPage();
    } else {
        renderHomePage();
    }
}

function showToast(msg) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'animate-toast p-4 rounded-xl flex items-center gap-3 text-xs font-black uppercase tracking-widest shadow-2xl border bg-purple-950 text-purple-200 border-purple-500/30';
    el.innerHTML = `<i class="fa-solid fa-info-circle text-purple-400"></i> ${escapeHTML(msg)}`;
    container.appendChild(el);
    setTimeout(() => {
        el.style.animation = 'slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
        setTimeout(() => el.remove(), 300);
    }, 3000);
}

function handleSearchInput() {
    clearTimeout(searchDebounceTimeout);

    if (!query) {
        const grid = document.getElementById('search-page-grid');
        if (grid) {

        return;
    }
    searchDebounceTimeout = setTimeout(() => {
        performSearchPage();
    }, 300);

async function performSearchPage() {
    const input = document.getElementById('search-page-input');
    if (!input) return;
    const query = input.value.trim();
    if (!query) return;

    const grid = document.getElementById('search-page-grid');
    grid.innerHTML = '<div class="col-span-full text-center py-20 text-purple-500"><i class="fa-solid fa-circle-notch animate-spin text-3xl"></i></div>';

    try {
        let res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=nl-NL`);
        let data = await res.json();
        let results = (data.results || []).filter(i => i.media_type === 'movie' || i.media_type === 'tv');

        if (results.length > 0) {
            grid.innerHTML = results.map(item => {
                let itemTitle = escapeHTML(item.title || item.name || 'Onbekend');
                let posterSrc = item.poster_path ? escapeHTML(`https://image.tmdb.org/t/p/w342${item.poster_path}`) : '';
                return `

                        <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-purple-500/10 relative card">

                            <span class="absolute top-2 left-2 bg-purple-600/90 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow">${item.media_type === 'tv' ? 'Serie' : 'Film'}</span>

                        <p class="text-[10px] font-black uppercase truncate text-slate-400 group-hover:text-white pl-1">${itemTitle}</p>
                    </div>
                `;
            }).join('');
        } else {
            grid.innerHTML = `<p class="col-span-full text-center text-slate-500 text-xs py-12">Niets gevonden voor "${escapeHTML(query)}".</p>`;
        }
    } catch (err) {
        console.error("Fout bij zoeken:", err);
    }
}

            <!-- Prequel / Sequel / Related Section -->
            <div id="relatedSection" class="hidden space-y-4"></div>

            <!-- Manual TMDb / IMDb Input -->
            <div class="bg-[#0e071b] p-4 rounded-2xl border border-purple-500/10">

                <div class="flex gap-2 mb-3">

        </div>
